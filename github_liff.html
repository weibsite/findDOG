<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>???隢葉...</title>
    <!-- 撘 LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f6f7;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00B900;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader" id="loader"></div>
        <h2 id="status">甇????函??隢?..</h2>
        <p id="desc">隢?????/p>
    </div>

    <script>
        // 隢‵撖思???LIFF ID
        const myLiffId = "2011657436-CNxIdkSe"; 

        async function initializeLiff() {
            try {
                showStatus("蝟餌絞??銝?(1/6)...");
                
                // 閮剖? 5 蝘??暹?璈
                const initTimeout = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error("Timeout")), 5000)
                );
                
                try {
                    await Promise.race([
                        liff.init({ liffId: myLiffId }),
                        initTimeout
                    ]);
                } catch (e) {
                    if (e.message === "Timeout") {
                        showStatus("?????∩?鈭?\n隢 LINE 敺瑼Ｘ LIFF Endpoint URL嚗????函??潦??曉蝬脣???蝬脣? (https://finddog.online/github_liff.html)嚗??賜頝唾??雯???);
                        return;
                    }
                    throw e;
                }
                
                showStatus("瑼Ｘ?餃???(2/6)...");
                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: window.location.href });
                    return;
                }

                showStatus("閫???隢???(3/6)...");
                const urlParams = new URLSearchParams(window.location.search);
                let inviter = urlParams.get('inviter');
                
                if (!inviter && urlParams.has('liff.state')) {
                    const stateStr = decodeURIComponent(urlParams.get('liff.state'));
                    if (stateStr.includes('inviter=')) {
                        const stateParams = new URLSearchParams(stateStr.replace('?', ''));
                        inviter = stateParams.get('inviter');
                    }
                }

                if (!inviter) {
                    showStatus("???臭??????隢?? (?曆???inviter)");
                    return;
                }

                showStatus("??雿輻??閮?(4/6)...");
                const profile = await liff.getProfile();
                const invitee = profile.userId;

                if (inviter === invitee) {
                    showStatus("?⊥?雿輻?芸楛??隢????");
                    setTimeout(() => liff.closeWindow(), 3000);
                    return;
                }

                showStatus("瑼Ｘ憟賢????(5/6)...");
                const friendship = await liff.getFriendship();
                
                if (friendship.friendFlag) {
                    showStatus("???隡箸??其葉 (6/6)...");
                    await notifyBackend(inviter, invitee);
                } else {
                    showStatus("隢??摰撣唾??箏末??");
                }

            } catch (err) {
                console.error("LIFF Initialization failed", err);
                showStatus("?潛??航炊嚗? + err.message);
            }
        }

        async function notifyBackend(inviter, invitee) {
            try {
                // ?雿?蝬? custom domain嚗?交? /config.json ?臭誑?踹? CORS
                const configRes = await fetch('/config.json?t=' + new Date().getTime());
                const configData = await configRes.json();
                
                const lineUrl = configData.line_url;
                if (!lineUrl) {
                    showStatus("?曆??唬撩????鞈?");
                    return;
                }

                const response = await fetch(lineUrl + '/api/referral', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ inviter, invitee })
                });
                
                const result = await response.json();
                
                showStatus("?隢???????");
                document.getElementById('desc').innerText = "?典隞仿??迨閬?銝血??啗?憭拙恕";
                
                setTimeout(() => {
                    liff.closeWindow();
                }, 3000);

            } catch (error) {
                console.error("API error", error);
                showStatus("隡箸??券???潛??航炊嚗? + error.message);
            }
        }

        function showStatus(text) {
            document.getElementById('status').innerText = text;
        }

        // ???瑁?
        initializeLiff();
    </script>
</body>
</html>
