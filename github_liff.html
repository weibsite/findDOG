<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>處理邀請中...</title>
    <!-- 引入 LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f6f7;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00B900;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader" id="loader"></div>
        <h2 id="status">正在處理您的邀請...</h2>
        <p id="desc">請稍候片刻</p>
    </div>

    <script>
        // 請填寫你的 LIFF ID
        const myLiffId = "2011657436-CNxIdkSe"; 

        async function initializeLiff() {
            try {
                showStatus("系統啟動中 (1/6)...");
                
                // 設定 5 秒的逾時機制
                const initTimeout = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error("Timeout")), 5000)
                );
                
                try {
                    await Promise.race([
                        liff.init({ liffId: myLiffId }),
                        initTimeout
                    ]);
                } catch (e) {
                    if (e.message === "Timeout") {
                        showStatus("❌ 啟動卡住了！\n請去 LINE 後台檢查 LIFF Endpoint URL，必須「完全等於」你現在網址列的網域 (https://finddog.online/github_liff.html)！不能用跳轉的網址。");
                        return;
                    }
                    throw e;
                }
                
                showStatus("檢查登入狀態 (2/6)...");
                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: window.location.href });
                    return;
                }

                showStatus("解析邀請參數 (3/6)...");
                const urlParams = new URLSearchParams(window.location.search);
                let inviter = urlParams.get('inviter');
                
                if (!inviter && urlParams.has('liff.state')) {
                    const stateStr = decodeURIComponent(urlParams.get('liff.state'));
                    if (stateStr.includes('inviter=')) {
                        const stateParams = new URLSearchParams(stateStr.replace('?', ''));
                        inviter = stateParams.get('inviter');
                    }
                }

                if (!inviter) {
                    showStatus("這不是一個有效的邀請連結 (找不到 inviter)");
                    return;
                }

                showStatus("取得使用者資訊 (4/6)...");
                const profile = await liff.getProfile();
                const invitee = profile.userId;

                // 為了方便測試，暫時關閉自己不能邀請自己的限制
                /*
                if (inviter === invitee) {
                    showStatus("無法使用自己的邀請連結喔！");
                    setTimeout(() => liff.closeWindow(), 3000);
                    return;
                }
                */

                showStatus("檢查好友狀態 (5/6)...");
                const friendship = await liff.getFriendship();
                
                if (friendship.friendFlag) {
                    showStatus("連線伺服器中 (6/6)...");
                    await notifyBackend(inviter, invitee);
                } else {
                    showStatus("請先加入官方帳號為好友！");
                }

            } catch (err) {
                console.error("LIFF Initialization failed", err);
                showStatus("發生錯誤：" + err.message);
            }
        }

        async function notifyBackend(inviter, invitee) {
            try {
                // 因為你有綁定 custom domain，直接抓 /config.json 可以避免 CORS
                const configRes = await fetch('/config.json?t=' + new Date().getTime());
                const configData = await configRes.json();
                
                const lineUrl = configData.line_url;
                if (!lineUrl) {
                    showStatus("找不到伺服器連線資訊");
                    return;
                }

                const response = await fetch(lineUrl + '/api/referral', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ inviter, invitee })
                });
                
                const result = await response.json();
                
                showStatus("邀請處理完成！🎉");
                document.getElementById('desc').innerText = "您可以關閉此視窗並回到聊天室";
                
                setTimeout(() => {
                    liff.closeWindow();
                }, 3000);

            } catch (error) {
                console.error("API error", error);
                showStatus("伺服器連線發生錯誤：" + error.message);
            }
        }

        function showStatus(text) {
            document.getElementById('status').innerText = text;
        }

        // 開始執行
        initializeLiff();
    </script>
</body>
</html>
