<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>???隢葉...</title>
    <!-- 撘 LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f6f7;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00B900;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container" id="processing-view">
        <div class="loader" id="loader"></div>
        <h2 id="status">甇????函??隢?隢?????..</h2>
        <p id="desc">隢?????/p>
    </div>

    <div class="container" id="dashboard-view" style="display: none;">
        <h2>?? ?隢葉敹?/h2>
        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 20px 0;">
            <p style="font-size: 16px; margin: 10px 0;">蝮賢???隢?<strong id="stat-total" style="color: #00B900; font-size: 24px;">-</strong> 鈭?/p>
            <p style="font-size: 16px; margin: 10px 0;">?桀??臬??活?賂?<strong id="stat-avail" style="color: #ff3366; font-size: 24px;">-</strong> 甈?/p>
        </div>
        
        <h3>?? ?函?撠惇?隢??</h3>
        <input type="text" id="invite-link" readonly style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; text-align: center; font-size: 14px;" value="頛銝?..">
        <button onclick="copyLink()" style="background-color: #00B900; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%;">銴ˊ???銝血?鈭?/button>
    </div>

    <script>
        const myLiffId = "2011657436-CNxIdkSe"; 

        async function initializeLiff() {
            try {
                const initTimeout = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error("Timeout")), 5000)
                );
                
                try {
                    await Promise.race([
                        liff.init({ liffId: myLiffId }),
                        initTimeout
                    ]);
                } catch (e) {
                    if (e.message === "Timeout") {
                        showStatus("?????∩?鈭?\n隢Ⅱ隤?LINE 敺 Endpoint URL??);
                        return;
                    }
                    throw e;
                }
                
                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: window.location.href });
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                let inviter = urlParams.get('inviter');
                
                if (!inviter && urlParams.has('liff.state')) {
                    const stateStr = decodeURIComponent(urlParams.get('liff.state'));
                    if (stateStr.includes('inviter=')) {
                        const stateParams = new URLSearchParams(stateStr.replace('?', ''));
                        inviter = stateParams.get('inviter');
                    }
                }

                const profile = await liff.getProfile();
                const userId = profile.userId;

                // 憒??葆 inviter ?嚗誨銵券銝甈⊿?隢?蝔?                if (inviter) {
                    if (inviter === userId) {
                        showStatus("?⊥?雿輻?芸楛??隢????");
                        setTimeout(() => liff.closeWindow(), 3000);
                        return;
                    }

                    const friendship = await liff.getFriendship();
                    if (friendship.friendFlag) {
                        await notifyBackend(inviter, userId);
                    } else {
                        showStatus("隢??摰撣唾??箏末??");
                    }
                } else {
                    // 瘝? inviter嚗誨銵其蝙?刻?芸楛暺?嚗＊蝷箏?銵冽
                    await showDashboard(userId);
                }

            } catch (err) {
                console.error("LIFF Initialization failed", err);
                showStatus("?潛??航炊嚗? + err.message);
            }
        }

        async function showDashboard(userId) {
            document.getElementById('processing-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            
            const link = `https://liff.line.me/${myLiffId}?inviter=${userId}`;
            document.getElementById('invite-link').value = link;
            
            try {
                const configRes = await fetch('/config.json?t=' + new Date().getTime());
                const configData = await configRes.json();
                
                const lineUrl = configData.line_url;
                if (!lineUrl) return;

                const response = await fetch(lineUrl + `/api/dashboard?user_id=${userId}`);
                const stats = await response.json();
                
                document.getElementById('stat-total').innerText = stats.total_invites;
                document.getElementById('stat-avail').innerText = stats.available_points;
                
            } catch (error) {
                console.error(error);
                document.getElementById('stat-total').innerText = "?";
                document.getElementById('stat-avail').innerText = "?";
            }
        }

        function copyLink() {
            const linkInput = document.getElementById('invite-link');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999); 
            document.execCommand("copy");
            alert("?隢??撌脰?鋆踝?頞翰?喟策???改?");
        }

        async function notifyBackend(inviter, invitee) {
            try {
                const configRes = await fetch('/config.json?t=' + new Date().getTime());
                const configData = await configRes.json();
                
                const lineUrl = configData.line_url;
                if (!lineUrl) {
                    showStatus("?曆??唬撩????鞈?");
                    return;
                }

                const response = await fetch(lineUrl + '/api/referral', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ inviter, invitee })
                });
                
                const result = await response.json();
                
                showStatus("?隢???????");
                document.getElementById('desc').innerText = "?典隞仿??迨閬?銝血??啗?憭拙恕";
                
                setTimeout(() => {
                    liff.closeWindow();
                }, 3000);

            } catch (error) {
                console.error("API error", error);
                showStatus("隡箸??券???潛??航炊嚗? + error.message);
            }
        }

        function showStatus(text) {
            const el = document.getElementById('status');
            if(el) el.innerText = text;
        }

        // ???瑁?
        initializeLiff();
    </script>
</body>
</html>
