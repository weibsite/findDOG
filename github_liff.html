<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邀請中心</title>
    <!-- 引入 LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f5f7; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 15px 10px; box-sizing: border-box; }
        .container { background-color: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: left; width: 100%; max-width: 100%; box-sizing: border-box; }
        h2 { color: #333; margin-top: 0; font-size: 16px; text-align: center; }
        p { color: #666; font-size: 14px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00B900; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container" id="processing-view" style="text-align: center;">
        <div class="loader" id="loader"></div>
        <h2 id="status" style="margin-top: 15px;"></h2>
    </div>

    <div class="container" id="dashboard-view" style="display: none;">
        <div style="background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-size: 14px; color: #333;">成功邀請：</span>
                <span style="font-size: 16px; color: #00B900; font-weight: bold;"><span id="stat-total">-</span> 人</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 14px; color: #333;">可兌換：<strong id="stat-avail" style="color: #ff3366; font-size: 18px;">-</strong> 次</span>
                <button id="redeem-btn" onclick="redeemPoints()" style="background-color: #ff3366; color: white; border: none; padding: 6px 12px; font-size: 13px; border-radius: 4px; cursor: pointer; display: none;">🎁 申請兌換</button>
            </div>
        </div>
        
        <h3 style="font-size: 14px; margin: 0 0 8px 0; color: #333;">👇 專屬邀請連結</h3>
        <div style="display: flex; gap: 8px; margin-bottom: 15px;">
            <input type="text" id="invite-link" readonly style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; min-width: 0;" value="載入中...">
            <button onclick="copyLink()" style="background-color: #666; color: white; border: none; padding: 8px 12px; font-size: 13px; border-radius: 4px; cursor: pointer; white-space: nowrap;">複製</button>
        </div>
        
        <button onclick="shareToLine()" style="background-color: #00B900; color: white; border: none; padding: 10px; font-size: 15px; border-radius: 4px; cursor: pointer; width: 100%;">📲 分享給 LINE 好友</button>
    </div>

    <script>
        const myLiffId = "2011657436-CNxIdkSe"; 
        let globalUserId = "";

        async function initializeLiff() {
            try {
                const initTimeout = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error("Timeout")), 5000)
                );
                
                try {
                    await Promise.race([
                        liff.init({ liffId: myLiffId }),
                        initTimeout
                    ]);
                } catch (e) {
                    if (e.message === "Timeout") {
                        showStatus("❌ 啟動卡住了！\n請確認 LINE 後台 Endpoint URL。");
                        return;
                    }
                    throw e;
                }
                
                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: window.location.href });
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                let inviter = urlParams.get('inviter');
                
                if (!inviter && urlParams.has('liff.state')) {
                    const stateStr = decodeURIComponent(urlParams.get('liff.state'));
                    if (stateStr.includes('inviter=')) {
                        const stateParams = new URLSearchParams(stateStr.replace('?', ''));
                        inviter = stateParams.get('inviter');
                    }
                }

                const profile = await liff.getProfile();
                globalUserId = profile.userId;

                // 如果有帶 inviter 參數，代表這是一次邀請流程
                if (inviter) {
                    if (inviter === globalUserId) {
                        showStatus("無法使用自己的邀請連結喔！");
                        setTimeout(() => liff.closeWindow(), 3000);
                        return;
                    }

                    const friendship = await liff.getFriendship();
                    if (friendship.friendFlag) {
                        await notifyBackend(inviter, globalUserId);
                    } else {
                        showStatus("請先加入官方帳號為好友！");
                    }
                } else {
                    // 沒有 inviter，代表使用者是自己點開，顯示儀表板
                    await showDashboard(globalUserId);
                }

            } catch (err) {
                console.error("LIFF Initialization failed", err);
                showStatus("發生錯誤：" + err.message);
            }
        }

        async function showDashboard(userId) {
            document.getElementById('processing-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            
            const link = `https://liff.line.me/${myLiffId}?inviter=${userId}`;
            document.getElementById('invite-link').value = link;
            
            try {
                const configRes = await fetch('/config.json?t=' + new Date().getTime());
                const configData = await configRes.json();
                
                const lineUrl = configData.line_url;
                if (!lineUrl) return;

                const response = await fetch(lineUrl + `/api/dashboard?user_id=${userId}`);
                const stats = await response.json();
                
                document.getElementById('stat-total').innerText = stats.total_invites;
                document.getElementById('stat-avail').innerText = stats.available_points;
                
                if (stats.available_points > 0) {
                    document.getElementById('redeem-btn').style.display = 'block';
                } else {
                    document.getElementById('redeem-btn').style.display = 'none';
                }
                
            } catch (error) {
                console.error(error);
                document.getElementById('stat-total').innerText = "?";
                document.getElementById('stat-avail').innerText = "?";
            }
        }
        
        async function redeemPoints() {
            if (!confirm("確定要申請兌換嗎？（這將扣除 1 點可兌換次數）")) return;
            
            const btn = document.getElementById('redeem-btn');
            btn.innerText = "處理中...";
            btn.disabled = true;
            
            try {
                const configRes = await fetch('/config.json?t=' + new Date().getTime());
                const configData = await configRes.json();
                const lineUrl = configData.line_url;
                
                const response = await fetch(lineUrl + '/api/redeem', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: globalUserId })
                });
                
                if (response.ok) {
                    alert("兌換申請已送出！客服人員將會與您聯繫。");
                    await showDashboard(globalUserId); // 重新載入數據
                } else {
                    const data = await response.json();
                    alert("兌換失敗：" + data.message);
                }
            } catch (err) {
                alert("連線錯誤，請稍後再試！");
            } finally {
                btn.innerText = "🎁 申請兌換獎勵";
                btn.disabled = false;
            }
        }

        async function shareToLine() {
            const link = document.getElementById('invite-link').value;
            if (liff.isApiAvailable('shareTargetPicker')) {
                try {
                    const res = await liff.shareTargetPicker([
                        {
                            type: "text",
                            text: `🎉 這是我專屬的邀請連結！\n趕快點擊下方連結加入我們，一起拿獎勵吧：\n${link}`
                        }
                    ]);
                    if (res) {
                        alert("分享成功！");
                    }
                } catch (error) {
                    console.error("分享失敗", error);
                    alert("分享失敗，請使用複製網址功能。");
                }
            } else {
                alert("目前環境不支援直接分享，請使用複製網址按鈕。");
            }
        }

        function copyLink() {
            const linkInput = document.getElementById('invite-link');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999); 
            document.execCommand("copy");
            alert("邀請連結已複製！趕快傳給朋友吧！");
        }

        async function notifyBackend(inviter, invitee) {
            try {
                const configRes = await fetch('/config.json?t=' + new Date().getTime());
                const configData = await configRes.json();
                
                const lineUrl = configData.line_url;
                if (!lineUrl) {
                    showStatus("找不到伺服器連線資訊");
                    return;
                }

                const response = await fetch(lineUrl + '/api/referral', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ inviter, invitee })
                });
                
                const result = await response.json();
                
                showStatus("恭喜你得到首購獎勵。");
                setTimeout(() => {
                    liff.closeWindow();
                }, 3000);

            } catch (error) {
                console.error("API error", error);
                showStatus("伺服器連線發生錯誤：" + error.message);
            }
        }

        function showStatus(text) {
            const el = document.getElementById('status');
            const loader = document.getElementById('loader');
            if(el) {
                el.innerText = text;
            }
            if(loader) {
                loader.style.display = 'none';
            }
        }

        // 開始執行
        initializeLiff();
    </script>
</body>
</html>
