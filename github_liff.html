<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>處理邀請中...</title>
    <!-- 引入 LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f6f7;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00B900;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader" id="loader"></div>
        <h2 id="status">正在處理您的邀請...</h2>
        <p id="desc">請稍候片刻</p>
    </div>

    <script>
        // 請填寫你的 LIFF ID
        const myLiffId = "2011649999-yqPxoQfg"; 

        async function initializeLiff() {
            try {
                await liff.init({ liffId: myLiffId });
                
                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: window.location.href });
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                const inviter = urlParams.get('inviter');

                if (!inviter) {
                    showStatus("這不是一個有效的邀請連結");
                    return;
                }

                const profile = await liff.getProfile();
                const invitee = profile.userId;

                if (inviter === invitee) {
                    showStatus("無法使用自己的邀請連結喔！");
                    setTimeout(() => liff.closeWindow(), 3000);
                    return;
                }

                const friendship = await liff.getFriendship();
                
                if (friendship.friendFlag) {
                    await notifyBackend(inviter, invitee);
                } else {
                    showStatus("請先加入官方帳號為好友！");
                }

            } catch (err) {
                console.error("LIFF Initialization failed", err);
                showStatus("初始化失敗，請稍後再試");
            }
        }

        async function notifyBackend(inviter, invitee) {
            try {
                // 1. 取得放在 GitHub 上的 config.json
                const configRes = await fetch('https://weibsite.github.io/findDOG/config.json?t=' + new Date().getTime());
                const configData = await configRes.json();
                
                // 2. 拿到最新的 LINE 伺服器網址
                const lineUrl = configData.line_url;
                if (!lineUrl) {
                    showStatus("找不到伺服器連線資訊");
                    return;
                }

                // 3. 發送請求到伺服器
                const response = await fetch(lineUrl + '/api/referral', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ inviter, invitee })
                });
                
                const result = await response.json();
                
                showStatus("邀請處理完成！");
                document.getElementById('desc').innerText = "您可以關閉此視窗並回到聊天室";
                
                setTimeout(() => {
                    liff.closeWindow();
                }, 3000);

            } catch (error) {
                console.error("API error", error);
                showStatus("系統連線發生錯誤");
            }
        }

        function showStatus(text) {
            document.getElementById('status').innerText = text;
            document.getElementById('loader').style.display = 'none';
        }

        initializeLiff();
    </script>
</body>
</html>
