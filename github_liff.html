<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>處理邀請中...</title>
    <!-- 引入 LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f6f7;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00B900;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container" id="processing-view">
        <div class="loader" id="loader"></div>
        <h2 id="status">正在處理您的邀請，請稍候片刻...</h2>
        <p id="desc">請稍候片刻</p>
    </div>

    <div class="container" id="dashboard-view" style="display: none;">
        <h2>📊 邀請中心</h2>
        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 20px 0;">
            <p style="font-size: 16px; margin: 10px 0;">總共成功邀請：<strong id="stat-total" style="color: #00B900; font-size: 24px;">-</strong> 人</p>
            <p style="font-size: 16px; margin: 10px 0;">目前可兌換次數：<strong id="stat-avail" style="color: #ff3366; font-size: 24px;">-</strong> 次</p>
        </div>
        
        <h3>👇 您的專屬邀請連結</h3>
        <input type="text" id="invite-link" readonly style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; text-align: center; font-size: 14px;" value="載入中...">
        <button onclick="copyLink()" style="background-color: #00B900; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%;">複製連結並分享</button>
    </div>

    <script>
        const myLiffId = "2011657436-CNxIdkSe"; 

        async function initializeLiff() {
            try {
                const initTimeout = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error("Timeout")), 5000)
                );
                
                try {
                    await Promise.race([
                        liff.init({ liffId: myLiffId }),
                        initTimeout
                    ]);
                } catch (e) {
                    if (e.message === "Timeout") {
                        showStatus("❌ 啟動卡住了！\n請確認 LINE 後台 Endpoint URL。");
                        return;
                    }
                    throw e;
                }
                
                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: window.location.href });
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                let inviter = urlParams.get('inviter');
                
                if (!inviter && urlParams.has('liff.state')) {
                    const stateStr = decodeURIComponent(urlParams.get('liff.state'));
                    if (stateStr.includes('inviter=')) {
                        const stateParams = new URLSearchParams(stateStr.replace('?', ''));
                        inviter = stateParams.get('inviter');
                    }
                }

                const profile = await liff.getProfile();
                const userId = profile.userId;

                // 如果有帶 inviter 參數，代表這是一次邀請流程
                if (inviter) {
                    if (inviter === userId) {
                        showStatus("無法使用自己的邀請連結喔！");
                        setTimeout(() => liff.closeWindow(), 3000);
                        return;
                    }

                    const friendship = await liff.getFriendship();
                    if (friendship.friendFlag) {
                        await notifyBackend(inviter, userId);
                    } else {
                        showStatus("請先加入官方帳號為好友！");
                    }
                } else {
                    // 沒有 inviter，代表使用者是自己點開，顯示儀表板
                    await showDashboard(userId);
                }

            } catch (err) {
                console.error("LIFF Initialization failed", err);
                showStatus("發生錯誤：" + err.message);
            }
        }

        async function showDashboard(userId) {
            document.getElementById('processing-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            
            const link = `https://liff.line.me/${myLiffId}?inviter=${userId}`;
            document.getElementById('invite-link').value = link;
            
            try {
                const configRes = await fetch('/config.json?t=' + new Date().getTime());
                const configData = await configRes.json();
                
                const lineUrl = configData.line_url;
                if (!lineUrl) return;

                const response = await fetch(lineUrl + `/api/dashboard?user_id=${userId}`);
                const stats = await response.json();
                
                document.getElementById('stat-total').innerText = stats.total_invites;
                document.getElementById('stat-avail').innerText = stats.available_points;
                
            } catch (error) {
                console.error(error);
                document.getElementById('stat-total').innerText = "?";
                document.getElementById('stat-avail').innerText = "?";
            }
        }

        function copyLink() {
            const linkInput = document.getElementById('invite-link');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999); 
            document.execCommand("copy");
            alert("邀請連結已複製！趕快傳給朋友吧！");
        }

        async function notifyBackend(inviter, invitee) {
            try {
                const configRes = await fetch('/config.json?t=' + new Date().getTime());
                const configData = await configRes.json();
                
                const lineUrl = configData.line_url;
                if (!lineUrl) {
                    showStatus("找不到伺服器連線資訊");
                    return;
                }

                const response = await fetch(lineUrl + '/api/referral', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ inviter, invitee })
                });
                
                const result = await response.json();
                
                showStatus("邀請處理完成！🎉");
                document.getElementById('desc').innerText = "您可以關閉此視窗並回到聊天室";
                
                setTimeout(() => {
                    liff.closeWindow();
                }, 3000);

            } catch (error) {
                console.error("API error", error);
                showStatus("伺服器連線發生錯誤：" + error.message);
            }
        }

        function showStatus(text) {
            const el = document.getElementById('status');
            if(el) el.innerText = text;
        }

        // 開始執行
        initializeLiff();
    </script>
</body>
</html>
