        function renderRoutes() { 
            if(!routesLayer)return; 
            routesLayer.clearLayers(); 
            Object.values(allRoutes).forEach(r=>{
                if((r.project&&r.project!==currentProjectKey)||!r.points)return;
                let c = r.color || '#ff0000';
                L.polyline(r.points,{color:c,weight:r.weight||5,opacity:0.9, pane:'routesPane'}).addTo(routesLayer).bindPopup(`<div class="font-bold text-center text-sm p-1 border-b-2 mb-1">${escapeHTML(r.name)}${r.project&&r.project!==currentProjectKey?` (${escapeHTML(r.project)})`:''}</div>`,{className:'pixel-popup'});
                
                let totalDist = 0;
                let dists = [0];
                for(let i=1; i<r.points.length; i++) {
                    totalDist += getDistance(r.points[i-1][0], r.points[i-1][1], r.points[i][0], r.points[i][1]);
                    dists.push(totalDist);
                }
                
                let labelPoints = [];
                if (totalDist < 5000) {
                     let mid = totalDist / 2;
                     let placed = false;
                     for(let i=1; i<r.points.length; i++) {
                         if(dists[i] >= mid) { labelPoints.push(r.points[i]); placed = true; break; }
                     }
                     if(!placed && r.points.length) labelPoints.push(r.points[Math.floor(r.points.length/2)]);
                } else {
                     let targetDist = 2500;
                     for(let i=1; i<r.points.length; i++) {
                         if(dists[i] >= targetDist) {
                             let candidatePt = r.points[i];
                             let tooClose = false;
                             for(let j=0; j<labelPoints.length; j++) {
                                 if(getDistance(candidatePt[0], candidatePt[1], labelPoints[j][0], labelPoints[j][1]) < 5000) {
                                     tooClose = true;
                                     break;
                                 }
                             }
                             if(!tooClose) {
                                 labelPoints.push(candidatePt);
                                 targetDist = dists[i] + 5000;
                             } else {
                                 targetDist += 500; // Check again a bit further
                             }
                         }
                     }

        async function processTrackImport(useTime) {
            hide('time-config-modal');
            
            let startTime = useTime ? $('time-config-start').value : '';
            let endTime = useTime ? $('time-config-end').value : '';
            
            let baseUrl = window.location.origin;
            if (NGROK_WS_URL) {
                baseUrl = NGROK_WS_URL.replace('wss://', 'https://').replace('ws://', 'http://').split('/ws')[0];
            }

            if (currentImportType === 'GPX') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const text = e.target.result;
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text, "text/xml");
                    const trkpts = xml.querySelectorAll("trkpt");
                    const pts = [];
                    trkpts.forEach(pt => {
                        pts.push({ lat: parseFloat(pt.getAttribute("lat")), lng: parseFloat(pt.getAttribute("lon")) });
                    });
                    if (pts.length > 0) {
                        tempGpxPoints = pts;
                        $('gpx-route-name').value = currentImportFile.name.replace(/\.[^/.]+$/, "");
                        show('gpx-config-modal');
                    } else {
                        showCenterToast("❌ 無法從 GPX 解析出軌跡");
                    }
                };
                reader.readAsText(currentImportFile);
            } else if (currentImportType === 'KMZ' || currentImportType === 'MYMAPS') {
                let fd = new FormData();
                fd.append("uid", myUid);
                fd.append("project", currentProjectKey);
                fd.append("start_time", startTime);
                fd.append("end_time", endTime);
                if (currentImportType === 'KMZ') {
                    fd.append("file", currentImportFile);
                } else {
                    fd.append("url", currentGmapUrl);
                }
                
                try {
                    showCenterToast("⏳ 伺服器正在解析 KMZ...");
                    let res = await fetch(baseUrl + '/api/upload_kml_sync', { method: 'POST', body: fd });
                    let data = await res.json();
                    if (data.success) {
                        showCenterToast(`✅ KMZ 匯入成功！\n解析到 ${data.points_count} 個點位\n將在背景持續更新軌跡。`);
                    } else {
                        showCenterToast("❌ 匯入失敗: " + data.msg);
                    }
                } catch (err) {
                    showCenterToast("❌ 伺服器連線失敗");
                }
            } else if (currentImportType === 'GMAP') {
                let fd = new FormData();
                fd.append("uid", myUid);
                fd.append("project", currentProjectKey);
                fd.append("url", currentGmapUrl);
                try {
                    showCenterToast("⏳ 正在取得 Google Maps 定位...");
                    let res = await fetch(baseUrl + '/api/upload_gmap_sync', { method: 'POST', body: fd });
                    let data = await res.json();
                    if (data.success) {
                        showCenterToast("✅ Google Maps 定位追蹤已啟動！");
                    } else {
                        showCenterToast("❌ 連線失敗: " + data.msg);
                    }
                } catch (err) {
                    showCenterToast("❌ 伺服器連線失敗");
                }
            }
            currentImportFile = null;
            currentGmapUrl = null;
        }

                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(ev.target.result, "text/xml");
                    const pts = [];
                    // 解析 GPX 軌跡點 (trkpt)
                    const trkpts = xmlDoc.getElementsByTagName("trkpt");
                    for (let i = 0; i < trkpts.length; i++) {
                        const lat = parseFloat(trkpts[i].getAttribute("lat"));
                        const lon = parseFloat(trkpts[i].getAttribute("lon"));
                        if (!isNaN(lat) && !isNaN(lon)) pts.push([lat, lon]);
                    }
                    // 如果沒有 trkpt，嘗試解析路徑點 (rtept)
                    if (pts.length === 0) {
                        const rtepts = xmlDoc.getElementsByTagName("rtept");
                        for (let i = 0; i < rtepts.length; i++) {
                            const lat = parseFloat(rtepts[i].getAttribute("lat"));
                            const lon = parseFloat(rtepts[i].getAttribute("lon"));
                            if (!isNaN(lat) && !isNaN(lon)) pts.push([lat, lon]);
                        }
                    }
                    
                    if (pts.length < 2) return showCenterToast("⚠️ GPX 檔案中找不到足夠軌跡點！");
                    
                    tempGpxPoints = pts;

        $('map-container').addEventListener('touchend', e => {
            if(!isMobileDevice) return;
            if(e.target.closest('.pixel-btn') || e.target.closest('.custom-div-icon') || e.target.closest('.leaflet-control') || e.target.closest('.leaflet-popup') || e.target.closest('button')) return;
            let now = Date.now();
            if(now - mapLastTapTime < 300) {
                e.preventDefault(); 
                if(map) map.setZoom(map.getZoom() + 1, {animate: true});
            }
            mapLastTapTime = now;
        }, {passive: false});
        // 自動隱藏管理面板
        $('admin-panel').addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (btn && btn.id !== 'close-admin-btn' && btn.id !== 'expand-admin-btn') {
                $('admin-panel').classList.add('admin-collapsed');
            }
        });

                window.addEventListener('DOMContentLoaded',initSystem);

        // ========== 手機版 UI 控制邏輯 ==========
        document.addEventListener('DOMContentLoaded', function() {
            if (window.innerWidth > 640) return; // 僅手機版啟用

            // --- 工具箱 Bottom Sheet ---
            const toolOverlay = document.getElementById('tool-sheet-overlay');
            const toolSheet = document.getElementById('tool-sheet');
            function openToolSheet() {
                toolOverlay.classList.add('show');
                toolSheet.classList.add('show');
            }
            function closeToolSheet() {
                toolSheet.classList.remove('show');
                setTimeout(() => toolOverlay.classList.remove('show'), 300);
            }
            document.getElementById('mobile-tool-btn')?.addEventListener('click', openToolSheet);
            toolOverlay?.addEventListener('click', closeToolSheet);
            
            // 工具箱內的項目 → 觸發原始按鈕的 click
            document.querySelectorAll('#tool-sheet .sheet-item').forEach(item => {
                item.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const origBtn = document.getElementById(targetId);
                    if (origBtn) origBtn.click();
                    closeToolSheet();
                });
            });

            // --- 底部操作列按鈕 ---
            // --- 底部操作列按鈕 ---
            // 省電 (原定位位置)
            document.getElementById('mobile-power-bar-btn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                enterPowerSavingMode();
            });
            // --- 手機版獨立地圖控制 (左下方) ---
            document.getElementById('mobile-zoom-in-btn')?.addEventListener('click', (e) => {
                e.preventDefault(); e.stopPropagation();
                if (map) map.zoomIn();
            });
            document.getElementById('mobile-zoom-out-btn')?.addEventListener('click', (e) => {
                e.preventDefault(); e.stopPropagation();
                if (map) map.zoomOut();
            });
            document.getElementById('mobile-locate-float-btn')?.addEventListener('click', (e) => {
                e.preventDefault(); e.stopPropagation();
                if (isSpectatorMode) {
                    showCenterToast("觀看模式下無法定位！");
                    return;
                }
                if (lastSavedPos) {
                    map.setView([lastSavedPos.lat, lastSavedPos.lng], 17, {animate: true});
                    isMapInteracting = false;
                } else {
                    showCenterToast("正在取得位置...");
                    map.locate({setView: true, maxZoom: 17});
                }
            });

            // 觀看模式
            document.getElementById('mobile-spectator-btn')?.addEventListener('click', () => {
                const origBtn = document.getElementById('spectator-btn');
                if (origBtn) origBtn.click();
                // 同步 label
                setTimeout(() => {
                    const label = document.getElementById('mobile-spectator-label');
                    if (label) label.textContent = isSpectatorMode ? '退出' : '觀看';
                }, 50);
            });
            document.getElementById('mobile-lock-btn')?.addEventListener('click', () => {
                const origBtn = document.getElementById('lock-project-btn');
                if (origBtn) origBtn.click();
            });

            // --- 頂部列：專案切換 Bottom Sheet ---
            const projectOverlay = document.getElementById('project-sheet-overlay');
            const projectSheet = document.getElementById('project-sheet');
            document.getElementById('mobile-top-project-trigger')?.addEventListener('click', () => {
                projectOverlay?.classList.add('show');
                projectSheet?.classList.add('show');
                document.getElementById('announcement-panel')?.classList.add('hidden');
            });
            const closeProjectSheet = () => {
                projectSheet?.classList.remove('show');
                setTimeout(() => {
                    projectOverlay?.classList.remove('show');
                    if (PROJECTS[currentProjectKey]) {
                        document.getElementById('announcement-panel')?.classList.remove('hidden');
                    }
                }, 300);
            };
            projectOverlay?.addEventListener('click', closeProjectSheet);
            document.getElementById('close-project-sheet-btn')?.addEventListener('click', closeProjectSheet);
            
            // 頂部列：點擊狀態燈 → 觸發原生登入/連線面板
            document.getElementById('mobile-sync-dot')?.addEventListener('click', () => {
                const trigger = document.getElementById('sync-ping');
                if (trigger) trigger.click();
            });

            // 頂部列：點擊個人色塊 → 觸發個人資料編輯
            document.getElementById('mobile-profile-trigger')?.addEventListener('click', () => {
                const trigger = document.getElementById('profile-edit-trigger');
                if (trigger) trigger.click();
            });

            // --- 步數面板：點擊 → 觸發原始步數面板點擊 ---
            document.getElementById('mobile-steps-trigger')?.addEventListener('click', () => {
                const origPanel = document.getElementById('step-panel');
                if (origPanel) origPanel.click();
            });


            // --- 同步函式：定時同步桌面版狀態到手機版 UI ---
            function syncMobileUI() {
                // 同步專案名稱
                const projText = document.getElementById('project-display-text');
                const mobileProjName = document.getElementById('mobile-project-name');
                if (projText && mobileProjName) mobileProjName.textContent = projText.textContent;

                // 同步連線狀態燈
                const syncPing = document.getElementById('sync-ping');
                const mobileDot = document.getElementById('mobile-sync-dot');
                if (syncPing && mobileDot) mobileDot.style.background = syncPing.style.backgroundColor || '#ef4444';

                // 同步個人資料色塊
                const profileDot = document.getElementById('profile-edit-trigger');
                const mobileProfileDot = document.getElementById('mobile-profile-trigger');
                if (profileDot && mobileProfileDot) mobileProfileDot.style.backgroundColor = profileDot.style.backgroundColor || '#666';

                // 同步步數
                const stepsVal = document.getElementById('step-counter-value');
                const mobileSteps = document.getElementById('mobile-step-value');
                if (stepsVal && mobileSteps) mobileSteps.textContent = stepsVal.textContent;

                // 同步鎖定
                // syncMobileLock();
            }

            // 每秒同步一次
            setInterval(syncMobileUI, 1000);
            // 初始同步
            setTimeout(syncMobileUI, 500);
            setTimeout(syncMobileUI, 2000);

            // 觀看提示自動消失
            setTimeout(() => {
                const hint = document.getElementById('spectator-hint');
                if (hint && !hint.classList.contains('hidden')) {
                    hint.style.transition = 'opacity 0.5s';
                    hint.style.opacity = '0';
                    setTimeout(() => hint.classList.add('hidden'), 500);
                    try { localStorage.setItem('dogMap_spectatorHintShown', 'true'); } catch(e){}
                }
            }, 4000);
        });
    
</script>
</body>
