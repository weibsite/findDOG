<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FindDOG - TEST</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            position: fixed; inset: 0; overflow: hidden;
            background-color: #1a202c;
            color: white;
            font-family: sans-serif;
        }
        
        #mobile-top-bar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 40px;
            background: rgba(255,0,0,0.5);
            padding-top: env(safe-area-inset-top, 0px);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
        }

        #mobile-bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(0,255,0,0.5);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
        }

        #map-container {
            position: fixed;
            left: 0; right: 0;
            background: rgba(0,0,255,0.2);
            /* Calculate top based on top bar + notch */
            top: calc(40px + env(safe-area-inset-top, 0px));
            /* Calculate bottom based on bottom bar + safe area */
            bottom: calc(60px + env(safe-area-inset-bottom, 0px));
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="mobile-top-bar">上方工具列 (TOP)</div>
    <div id="map-container">中間區域 (MAP)</div>
    <div id="mobile-bottom-bar">下方工具列 (BOTTOM)</div>
</body>
</html>
