<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FindDOG - TEST 4</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: #1a202c;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            margin-top: 50px; /* Force it down to see if the top was clipped */
            height: calc(100vh - 50px);
        }
        
        #mobile-top-bar {
            flex: 0 0 auto;
            width: 100%;
            height: 100px;
            background: rgba(255,0,0,1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        #map-container {
            flex: 1 1 auto;
            width: 100%;
            background: rgba(0,0,255,0.2);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
            padding: 20px;
            text-align: center;
        }

        #mobile-bottom-bar {
            flex: 0 0 auto;
            width: 100%;
            height: 60px;
            background: rgba(0,255,0,1);
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div id="mobile-top-bar">
        上方工具列 (TOP) 100px 高
        <div id="metrics" style="font-size: 12px; margin-top: 10px;"></div>
    </div>
    <div id="map-container">
        中間區域 (MAP)<br><br>
        如果您能看到上方的紅色區域，代表原本的區域被 Chrome 的標題列或瀏海吃掉了！
    </div>
    <div id="mobile-bottom-bar">下方工具列 (BOTTOM)</div>

    <script>
        function updateMetrics() {
            let m = document.getElementById('metrics');
            let vv = window.visualViewport;
            m.innerHTML = `
                innerH: ${window.innerHeight} <br>
                outerH: ${window.outerHeight} <br>
                vv.offsetTop: ${vv ? vv.offsetTop : 'N/A'} <br>
                vv.height: ${vv ? vv.height : 'N/A'} <br>
                scrollY: ${window.scrollY}
            `;
        }
        setInterval(updateMetrics, 500);
        updateMetrics();
    </script>
</body>
</html>
