<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FindDOG - TEST 6</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100dvh; /* Use 100dvh so it respects the URL bar */
            overflow-x: hidden;
            overflow-y: auto; /* ALLOW SCROLLING to prevent compositor desync */
            background-color: #1a202c;
            color: white; font-family: sans-serif;
            /* DO NOT USE POSITION FIXED HERE */
        }
        
        #mobile-top-bar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 40px;
            background: rgba(255,0,0,1);
            padding-top: env(safe-area-inset-top, 0px);
            z-index: 2000;
            display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px;
            box-sizing: content-box;
        }

        #map-container {
            position: fixed;
            top: calc(40px + env(safe-area-inset-top, 0px));
            bottom: calc(60px + env(safe-area-inset-bottom, 0px));
            left: 0; right: 0;
            background: rgba(0,0,255,0.2);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
        }

        #mobile-bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(0,255,0,1);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            box-sizing: content-box;
            z-index: 2000;
            display: flex; align-items: flex-start; justify-content: center; padding-top: 5px;
        }

        #startup-overlay {
            position: fixed; inset: 0; z-index: 50000;
            background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div id="mobile-top-bar">上方工具列 (TOP) 40px + Safe Area</div>
    <div id="map-container">
        中間區域 (MAP)<br><br>
        1. 點擊輸入框叫出鍵盤。<br>
        2. 點擊開始按鈕。<br>
        3. 觀察這三個色塊是否完美維持原位，還是會被往上推？
        <div id="metrics" style="font-size: 12px; margin-top: 10px;"></div>
    </div>
    <div id="mobile-bottom-bar">下方工具列 (BOTTOM) 60px + Safe Area</div>

    <div id="startup-overlay">
        <h2>歡迎畫面</h2>
        <input type="text" id="user-name" placeholder="點擊這裡叫出鍵盤" style="padding: 10px; font-size: 16px; margin: 20px 0;">
        <button id="start-btn" style="padding: 15px 30px; font-size: 18px;">開始測試</button>
    </div>

    <script>
        document.getElementById('start-btn').addEventListener('click', () => {
            let btn = document.getElementById('start-btn');
            btn.innerText = "收合鍵盤中...";
            
            // 強制收合鍵盤
            document.activeElement.blur();
            document.getElementById('user-name').blur();

            // 延遲 500ms 等待 iOS 動畫結束，才隱藏歡迎視窗
            setTimeout(() => {
                document.getElementById('startup-overlay').style.display = 'none';
                
                // 動畫結束後，強制把任何殘留的滾動拉回頂部
                window.scrollTo(0,0);
            }, 600);
        });

        function updateMetrics() {
            let m = document.getElementById('metrics');
            let vv = window.visualViewport;
            m.innerHTML = `
                innerH: ${window.innerHeight} <br>
                outerH: ${window.outerHeight} <br>
                vv.offsetTop: ${vv ? vv.offsetTop : 'N/A'} <br>
                vv.height: ${vv ? vv.height : 'N/A'} <br>
                scrollY: ${window.scrollY}
            `;
        }
        setInterval(updateMetrics, 500);
        updateMetrics();
    </script>
</body>
</html>
