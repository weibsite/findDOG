<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FindDOG - TEST 4</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background-color: #1a202c;
            color: white;
            font-family: sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        
        #mobile-top-bar {
            flex: 0 0 auto;
            width: 100%;
            /* Make it 120px tall to see if it peeks out from under the notch/UI */
            height: 120px;
            background: rgba(255,0,0,0.5);
            display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 8px;
        }

        #map-container {
            flex: 1 1 auto;
            width: 100%;
            background: rgba(0,0,255,0.2);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        #mobile-bottom-bar {
            flex: 0 0 auto;
            width: 100%;
            height: 60px;
            background: rgba(0,255,0,0.5);
            display: flex; align-items: flex-start; justify-content: center;
            padding-top: 8px;
        }
    </style>
</head>
<body>
    <div id="mobile-top-bar">上方工具列 (TOP) 120px</div>
    <div id="map-container">中間區域 (MAP)</div>
    <div id="mobile-bottom-bar">下方工具列 (BOTTOM)</div>
</body>
</html>
