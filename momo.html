<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOMO 購物網 - 題庫即時搜尋器</title>
  <style>
    :root {
      --primary: #ff385c;
      --primary-gradient: linear-gradient(135deg, #ff385c 0%, #e00b41 100%);
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --highlight: #fef08a;
      --success: #10b981;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-hover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 80px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 28px;
      position: relative;
    }

    /* 右上綠底 MOMO知識王官方LINE 連結按鈕 */
    .line-official-btn {
      position: absolute;
      top: 0;
      right: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #06c755; /* LINE 官方綠底 */
      color: #ffffff !important;
      padding: 9px 18px;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(6, 199, 85, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    .line-official-btn:hover {
      background: #05b34c;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(6, 199, 85, 0.45);
    }

    @media (max-width: 680px) {
      .line-official-btn {
        position: static;
        margin: 0 auto 12px;
        display: inline-flex;
        font-size: 0.85rem;
        padding: 7px 15px;
      }
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffe4e6;
      color: #be123c;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Search Box Sticky */
    .search-wrapper {
      position: sticky;
      top: 16px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      padding: 12px;
      border: 1px solid rgba(226, 232, 240, 0.8);
      margin-bottom: 20px;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 8px 14px;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .search-bar:focus-within {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 56, 92, 0.15);
    }

    .search-icon {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    input#searchInput {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 1.1rem;
      color: var(--text);
      outline: none;
    }

    input#searchInput::placeholder {
      color: #94a3b8;
    }

    .clear-btn {
      background: #cbd5e1;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      color: #475569;
      transition: 0.15s;
    }

    .clear-btn:hover {
      background: #94a3b8;
      color: #fff;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      padding: 0 4px;
    }

    .stats {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .stats span {
      color: var(--primary);
      font-weight: 700;
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-btn {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #475569;
      padding: 4px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.15s;
    }

    .tag-btn:hover {
      background: #fee2e2;
      color: var(--primary);
      border-color: #fecdd3;
    }

    /* Question Cards List */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .q-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .q-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: #cbd5e1;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .q-num {
      background: #f1f5f9;
      color: #475569;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .q-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.5;
      flex: 1;
    }

    /* Answer Row */
    .ans-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .ans-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #15803d;
      flex-shrink: 0;
    }

    .ans-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: #166534;
      flex: 1;
      word-break: break-all;
    }

    .ans-img {
      max-height: 90px;
      max-width: 140px;
      border-radius: 6px;
      border: 1px solid #bbf7d0;
      background: #fff;
      cursor: zoom-in;
      transition: transform 0.2s;
    }

    .ans-img:hover {
      transform: scale(1.05);
    }

    /* Answer Actions (Like / Dislike / Arrow) */
    .ans-actions {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .vote-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .vote-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .vote-btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      transform: translateY(-1px);
    }

    .vote-btn.like-btn.active {
      background: #dcfce7;
      border-color: #22c55e;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
    }

    .vote-btn.dislike-btn.active {
      background: #fee2e2;
      border-color: #ef4444;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.25);
    }

    /* 按讚旁邊的綠字數量 / 反讚旁邊的紅字數量 */
    .vote-num {
      font-size: 0.95rem;
      font-weight: 800;
      min-width: 14px;
      cursor: pointer;
      line-height: 1;
      transition: transform 0.15s ease;
    }

    .vote-num:hover {
      transform: scale(1.15);
    }

    .vote-num.like-num {
      color: #16a34a; /* 綠字 代表按讚數量 */
    }

    .vote-num.dislike-num {
      color: #dc2626; /* 紅字 代表反讚數量 */
    }

    /* Upward Arrow & Popover */
    .popover-wrapper {
      position: relative;
      display: inline-flex;
    }

    .arrow-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .arrow-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
      border-color: #94a3b8;
      transform: translateY(-1px);
    }

    .arrow-btn.active {
      background: #e2e8f0;
      color: #0f172a;
      border-color: #64748b;
    }

    .popover-bubble {
      position: absolute;
      bottom: calc(100% + 10px);
      right: 0;
      background: #0f172a;
      color: #ffffff;
      padding: 9px 14px;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      z-index: 150;
      cursor: pointer;
      display: none;
      flex-direction: column;
      gap: 3px;
      white-space: nowrap;
      animation: popoverFadeIn 0.15s ease-out;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .popover-bubble.show {
      display: flex;
    }

    .popover-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      right: 10px;
      border-width: 6px;
      border-style: solid;
      border-color: #0f172a transparent transparent transparent;
    }

    .popover-bubble:hover {
      background: #1e293b;
    }

    .popover-bubble:hover .popover-line2 {
      color: #38bdf8;
      text-decoration: underline;
    }

    .popover-line1 {
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    .popover-line2 {
      font-size: 0.86rem;
      font-weight: 700;
      color: #67e8f9;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    @keyframes popoverFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Modal Overlay & Card */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: #ffffff;
      border-radius: 14px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
      border: 1px solid #e2e8f0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #f1f5f9;
      background: #f8fafc;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: #64748b;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
      transition: 0.15s;
    }

    .modal-close-btn:hover {
      color: #0f172a;
      background: #e2e8f0;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-q-preview {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
    }

    .modal-q-badge {
      display: inline-block;
      background: #e2e8f0;
      color: #334155;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .modal-q-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.4;
    }

    .modal-current-ans {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.85rem;
      color: #166534;
      word-break: break-all;
    }

    .modal-current-ans span.curr-label {
      font-weight: 700;
      color: #15803d;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: #334155;
    }

    .input-with-upload {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .form-input {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      color: #0f172a;
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 56, 92, 0.15);
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      height: 42px;
      flex-shrink: 0;
    }

    .upload-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
      color: #0f172a;
    }

    .image-preview-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 4px;
    }

    .preview-thumbnail-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .preview-thumbnail-wrap img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
    }

    .preview-meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .preview-filename {
      font-size: 0.82rem;
      font-weight: 600;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .preview-filesize {
      font-size: 0.75rem;
      color: #64748b;
    }

    .preview-remove-btn {
      background: #fee2e2;
      border: 1px solid #fecdd3;
      color: #b91c1c;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .preview-remove-btn:hover {
      background: #fca5a5;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid #f1f5f9;
      background: #f8fafc;
    }

    .btn-cancel {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn-cancel:hover {
      background: #f1f5f9;
    }

    .btn-submit {
      background: var(--primary-gradient);
      border: none;
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(224, 11, 65, 0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(224, 11, 65, 0.4);
    }

    /* 即時資料庫連線標籤 */
    .db-sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 9999px;
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
      margin-left: 8px;
      vertical-align: middle;
      transition: all 0.2s ease;
    }

    .db-sync-badge.online {
      background: #f0fdf4;
      color: #15803d;
      border-color: #bbf7d0;
    }

    .db-sync-badge.offline {
      background: #f8fafc;
      color: #64748b;
      border-color: #e2e8f0;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
    }

    .db-sync-badge.online .badge-dot {
      background: #22c55e;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #f8fafc;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {
      .ans-box {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .ans-actions {
        justify-content: flex-end;
      }
      .modal-card {
        max-width: 95%;
      }
      .input-with-upload {
        flex-direction: column;
        align-items: stretch;
      }
      .upload-btn {
        justify-content: center;
      }
      .toast-msg {
        max-width: 90%;
        white-space: normal;
        text-align: center;
      }
    }

    /* Wrong answers & Meta */
    .wrong-box {
      font-size: 0.85rem;
      color: #64748b;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .wrong-tag {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fee2e2;
      padding: 2px 8px;
      border-radius: 4px;
      text-decoration: line-through;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #f1f5f9;
    }

    .update-time-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.76rem;
      color: #64748b;
      background: #f8fafc;
      padding: 3px 10px;
      border-radius: 9999px;
      border: 1px solid #e2e8f0;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .update-time-pill:hover {
      background: #f1f5f9;
      color: #334155;
      border-color: #cbd5e1;
    }

    /* Highlight */
    mark {
      background: var(--highlight);
      color: inherit;
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: inherit;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: #fff;

            <a href="${targetImg}" target="_blank" title="點擊檢視原圖">

            <div class="ans-value">${highlight(textDesc, query)}</div>

            <a href="${targetImg}" target="_blank" title="點擊檢視原圖">
              <img class="ans-img" src="${targetImg}" alt="答案圖片" loading="lazy">
            </a>

      }

      const userVote = getDeviceVote(item);
      const counts = VOTE_COUNTS[item.id] || { likes: item.likes || 0, dislikes: item.dislikes || 0 };
      const likeCount = counts.likes || 0;
      const dislikeCount = counts.dislikes || 0;

      card.innerHTML = `
        <div class="card-header">
          <span class="q-num">#${item.id}</span>
          <div class="q-title">${highlightedQ}</div>
        </div>
        <div class="ans-box">
          <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
            <span class="ans-label">✓ 正解</span>

          </div>
          <div class="ans-actions">
            <div class="vote-item">
              <button class="vote-btn like-btn ${userVote === 'like' ? 'active' : ''}"

                      title="按讚（這個答案是正確的）">
                👍

              <span class="vote-num like-num" id="like-count-${item.id}" onclick="handleVote(${item.id}, 'like', event)" title="按讚數量">${likeCount}</span>

                👎

                  <polyline points="5 12 12 5 19 12"></polyline>
                </svg>

          <span class="update-time-pill" title="此題答案最後獨立更新時間">🕒 答案更新時間：${item.date || '未知'}</span>

      return card;
    }

    function updateSearch() {
      const query = searchInput.value.trim().toLowerCase();
      clearBtn.style.display = query ? 'flex' : 'none';

      if (!query) {
        currentResults = ALL_QUESTIONS;
      } else {
        const terms = query.split(/\s+/).filter(Boolean);
        currentResults = ALL_QUESTIONS.filter(item => {
          const target = (item.q + ' ' + (item.ans || '') + ' ' + (item.wrong ? item.wrong.join(' ') : '')).toLowerCase();
          return terms.every(t => target.includes(t));
        });
      }

      filteredCount.textContent = currentResults.length.toLocaleString();
      cardList.innerHTML = '';
      displayedCount = 0;

      if (currentResults.length === 0) {
        emptyState.style.display = 'block';
        loadMoreBtn.style.display = 'none';
      } else {
        emptyState.style.display = 'none';
        loadMore();
      }
    }

    function loadMore() {
      const fragment = document.createDocumentFragment();
      const nextBatch = currentResults.slice(displayedCount, displayedCount + PAGE_SIZE);
      const query = searchInput.value.trim();

      nextBatch.forEach(item => {
        fragment.appendChild(renderCard(item, query));
      });

      cardList.appendChild(fragment);
      displayedCount += nextBatch.length;

      loadMoreBtn.style.display = displayedCount < currentResults.length ? 'block' : 'none';
      loadMoreBtn.textContent = `載入更多題目... (${displayedCount} / ${currentResults.length})`;
    }

    function setQuery(text) {
      searchInput.value = text;
      searchInput.focus();
      updateSearch();
    }

    function handleVote(qid, type, event) {
      if (event) event.stopPropagation();

      const item = ALL_QUESTIONS.find(q => q.id === qid);
      if (!item) return;

      const currentVote = getDeviceVote(item);
      if (!VOTE_COUNTS[qid]) {
        VOTE_COUNTS[qid] = { likes: item.likes || 0, dislikes: item.dislikes || 0 };
      }

      if (currentVote === type) {
        showToast(type === 'like' ? '您已為此答案點過讚囉！' : '您已為此答案按過反讚囉！');
        return;
      }

      const prevType = currentVote;

      if (currentVote && currentVote !== type) {
        // 從另一個評價切換過來 (每個設備每個答案限投一票)
        if (currentVote === 'like') {
          VOTE_COUNTS[qid].likes = Math.max(0, (VOTE_COUNTS[qid].likes || 0) - 1);
          VOTE_COUNTS[qid].dislikes = (VOTE_COUNTS[qid].dislikes || 0) + 1;
        } else {
          VOTE_COUNTS[qid].dislikes = Math.max(0, (VOTE_COUNTS[qid].dislikes || 0) - 1);
          VOTE_COUNTS[qid].likes = (VOTE_COUNTS[qid].likes || 0) + 1;
        }
        USER_VOTES[qid] = { type: type, ans: item.ans || '', date: item.date || '' };
        showToast(type === 'like' ? '已變更評價為讚 👍' : '已變更評價為反讚 👎');
      } else {
        // 第一次投票
        if (type === 'like') {
          VOTE_COUNTS[qid].likes = (VOTE_COUNTS[qid].likes || 0) + 1;
          showToast('已點讚 👍 感謝您的評價！');
        } else {
          VOTE_COUNTS[qid].dislikes = (VOTE_COUNTS[qid].dislikes || 0) + 1;
          showToast('已按反讚 👎 若知道正解歡迎點箭頭回報！');
        }
        USER_VOTES[qid] = { type: type, ans: item.ans || '', date: item.date || '' };
      }

      // 同步記憶體物件
      item.likes = VOTE_COUNTS[qid].likes;
      item.dislikes = VOTE_COUNTS[qid].dislikes;

      saveVotes();
      updateVoteButtonsUI(qid);

      // 送至伺服器即時同步 SQLite 資料庫
      sendVoteToServer(qid, type, prevType);
    }

    function sendVoteToServer(qid, type, prevType) {
      const voteUrl = (window.location.protocol === 'file:' || !window.location.host.includes('9ysong.shop'))
        ? 'https://api.9ysong.shop/callback2/api/vote'
        : '/callback2/api/vote';

      fetch(voteUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ qid: qid, type: type, prev: prevType })
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.status === 'success' && data.counts) {
          VOTE_COUNTS[qid] = {
            likes: data.counts.likes,
            dislikes: data.counts.dislikes
          };
          const it = ALL_QUESTIONS.find(q => q.id === qid);
          if (it) {
            it.likes = data.counts.likes;
            it.dislikes = data.counts.dislikes;
          }
          saveVotes();
          updateVoteButtonsUI(qid);
        }
      })
      .catch(err => {
        console.log('[投票已記錄於本地設備]', err);
      });
    }

    function updateVoteButtonsUI(qid) {
      const item = ALL_QUESTIONS.find(q => q.id === qid);
      const userVote = getDeviceVote(item);
      const counts = VOTE_COUNTS[qid] || (item ? { likes: item.likes || 0, dislikes: item.dislikes || 0 } : { likes: 0, dislikes: 0 });

      const likeBtn = document.getElementById(`like-btn-${qid}`);
      const dislikeBtn = document.getElementById(`dislike-btn-${qid}`);
      const likeCountEl = document.getElementById(`like-count-${qid}`);
      const dislikeCountEl = document.getElementById(`dislike-count-${qid}`);

      if (likeBtn) {
        likeBtn.classList.toggle('active', userVote === 'like');
      }
      if (dislikeBtn) {
        dislikeBtn.classList.toggle('active', userVote === 'dislike');
      }
      if (likeCountEl) {
        likeCountEl.textContent = counts.likes || 0;
      }
      if (dislikeCountEl) {
        dislikeCountEl.textContent = counts.dislikes || 0;
      }
    }

    function toggleAnswerBubble(qid, event) {
      if (event) event.stopPropagation();
      const popover = document.getElementById(`popover-${qid}`);
      const arrowBtn = document.getElementById(`arrow-btn-${qid}`);
      const isAlreadyShow = popover && popover.classList.contains('show');

      // 關閉所有其他浮框
      document.querySelectorAll('.popover-bubble.show').forEach(el => el.classList.remove('show'));
      document.querySelectorAll('.arrow-btn.active').forEach(el => el.classList.remove('active'));

      if (!isAlreadyShow && popover) {
        popover.classList.add('show');
        if (arrowBtn) arrowBtn.classList.add('active');
      }
    }

    // 點擊頁面其他地方自動關閉浮框
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.popover-wrapper')) {
        document.querySelectorAll('.popover-bubble.show').forEach(el => el.classList.remove('show'));
        document.querySelectorAll('.arrow-btn.active').forEach(el => el.classList.remove('active'));
      }
    });

    // 修正/提供答案選項狀態 (4 個選項：A、B、C、D)
    let reportOptions = [
      { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: true },
      { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: false },
      { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: false },
      { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: false }
    ];

    function openReportModal(qid, event) {
      if (event) event.stopPropagation();

      // 關閉所有浮框
      document.querySelectorAll('.popover-bubble.show').forEach(el => el.classList.remove('show'));
      document.querySelectorAll('.arrow-btn.active').forEach(el => el.classList.remove('active'));

      const item = ALL_QUESTIONS.find(q => q.id === qid);
      if (!item) return;

      currentReportingItem = item;

      document.getElementById('modalQNum').textContent = '#' + item.id;
      document.getElementById('modalQText').textContent = item.q;
      
      const currentAnsEl = document.getElementById('modalCurrentAns');
      if (isImageUrl(item.ans)) {
        currentAnsEl.innerHTML = `<a href="${item.ans}" target="_blank" style="color: #166534; text-decoration: underline;">[圖片答案 (點此開啟連結)]</a>`;
      } else {
        currentAnsEl.textContent = item.ans || '（目前無正解）';
      }

      document.getElementById('modalNoteInput').value = '';

      // 初始化 4 個選項：帶入題目目前的答案與已知錯誤選項
      const isAnsImg = isImageUrl(item.ans);
      const hasImg = Boolean(item.img_url) || isAnsImg;
      const targetImg = item.img_url || (isAnsImg ? item.ans : '');
      const textDesc = (!isAnsImg && item.ans) ? item.ans : '';

      reportOptions = [
        {
          mode: hasImg ? 'image' : 'text',
          val: textDesc,
          imgBase64: targetImg,
          textDesc: textDesc,
          isCorrect: true
        },
        { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: false },
        { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: false },
        { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: false }
      ];

      // 帶入既有錯誤選項
      const textWrongs = (item.wrong || []).filter(w => !isImageUrl(w));
      const imgWrongs = [...(item.wrong || []).filter(w => isImageUrl(w)), ...(item.wrong_imgs || [])];

      let wrongSlot = 1;
      textWrongs.forEach(tw => {
        if (wrongSlot < 4) {
          reportOptions[wrongSlot].mode = 'text';
          reportOptions[wrongSlot].val = tw;
          reportOptions[wrongSlot].textDesc = '';
          reportOptions[wrongSlot].imgBase64 = '';
          wrongSlot++;
        }
      });
      imgWrongs.forEach(iw => {
        if (wrongSlot < 4) {
          reportOptions[wrongSlot].mode = 'image';
          reportOptions[wrongSlot].imgBase64 = iw;
          reportOptions[wrongSlot].textDesc = '';
          reportOptions[wrongSlot].val = '';
          wrongSlot++;
        }
      });

      renderReportOptionCards();

      const modal = document.getElementById('reportModal');
      modal.style.display = 'flex';
    }

    function closeReportModal() {
      const modal = document.getElementById('reportModal');
      if (modal) modal.style.display = 'none';
      currentReportingItem = null;
    }

    // 渲染「提供/修正答案」4 個選項卡片 (樣式與增加題庫一致)
    function renderReportOptionCards() {
      const container = document.getElementById('reportOptionCardsContainer');
      if (!container) return;

      const labels = ['選項 A', '選項 B', '選項 C', '選項 D'];
      container.innerHTML = '';

      reportOptions.forEach((opt, idx) => {
        const card = document.createElement('div');
        card.className = `opt-card ${opt.isCorrect ? 'is-correct-card' : ''}`;

        const isCorrectHtml = opt.isCorrect 
          ? `<span class="opt-status-badge correct">⭕ 唯一正解</span>`
          : `<span class="opt-status-badge wrong">❌ 錯誤答案</span>`;

        let bodyHtml = '';
        if (opt.mode === 'text') {
          bodyHtml = `
            <input type="text" 
                   class="form-input" 
                   id="reportOptVal_${idx}" 
                   placeholder="輸入 ${labels[idx]} 文字內容（例如：商品名、答案詞彙）..." 
                   value="${escapeHtml(opt.val)}" 
                   oninput="reportOptions[${idx}].val = this.value"
                   autocomplete="off">
          `;
        } else {
          // 圖片模式：左邊圖片/上傳按鈕，右邊輸入文字敘述
          let leftHtml = '';
          if (opt.imgBase64) {
            leftHtml = `
              <div class="opt-img-left">
                <img src="${opt.imgBase64}" class="opt-img-thumb" alt="選項圖片">
                <div style="display: flex; flex-direction: column; gap: 4px;">
                  <button type="button" class="opt-act-btn" onclick="openCropEditorForReportOption(${idx})">
                    ✂️ 放大/縮小範圍
                  </button>
                  <button type="button" class="opt-act-btn" onclick="clearReportOptionImage(${idx})" style="color: #ef4444;">
                    🗑️ 移除圖片
                  </button>
                </div>
              </div>
            `;
          } else {
            leftHtml = `
              <div class="opt-img-left">
                <button type="button" class="opt-act-btn" onclick="document.getElementById('reportOptFileInput_${idx}').click()" style="background: #0284c7; color: #fff; border-color: #0284c7; padding: 7px 12px;">
                  📷 選擇圖片並裁切範圍
                </button>
                <input type="file" id="reportOptFileInput_${idx}" accept="image/*" style="display:none;" onchange="handleReportOptionImageFile(${idx}, event)">
              </div>
            `;
          }

          bodyHtml = `
            <div class="opt-img-row">
              ${leftHtml}
              <div class="opt-img-right">
                <input type="text" 
                       class="form-input" 
                       id="reportOptTextDesc_${idx}" 
                       placeholder="輸入文字敘述（例如：左下黑 右上白、粉紅瓶子等）..." 
                       value="${escapeHtml(opt.textDesc || '')}" 
                       oninput="reportOptions[${idx}].textDesc = this.value"
                       autocomplete="off">
                <div class="opt-desc-tip">
                  💡 說明：輸入文字敘述讓別人能夠不看圖片就知道答案
                </div>
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="opt-card-header">
            <label class="opt-radio-wrapper" onclick="setReportCorrectOption(${idx})">
              <input type="radio" name="reportOptCorrectRadio" id="reportOptRadio_${idx}" ${opt.isCorrect ? 'checked' : ''} style="cursor: pointer; accent-color: #16a34a;">
              <span style="font-weight: 800; font-size: 0.9rem; color: #1e293b;">${labels[idx]}</span>
              ${isCorrectHtml}
            </label>
            <div class="opt-mode-tabs">
              <button type="button" class="opt-mode-btn ${opt.mode === 'text' ? 'active' : ''}" onclick="switchReportOptionMode(${idx}, 'text')">📝 文字</button>
              <button type="button" class="opt-mode-btn ${opt.mode === 'image' ? 'active' : ''}" onclick="switchReportOptionMode(${idx}, 'image')">🖼️ 圖片</button>
            </div>
          </div>
          <div>${bodyHtml}</div>
        `;

        container.appendChild(card);
      });
    }

    function setReportCorrectOption(targetIdx) {
      reportOptions.forEach((opt, idx) => {
        opt.isCorrect = (idx === targetIdx);
      });
      renderReportOptionCards();
    }

    function switchReportOptionMode(idx, mode) {
      if (mode === 'image' && !reportOptions[idx].textDesc && reportOptions[idx].val) {
        reportOptions[idx].textDesc = reportOptions[idx].val;
      } else if (mode === 'text' && !reportOptions[idx].val && reportOptions[idx].textDesc) {
        reportOptions[idx].val = reportOptions[idx].textDesc;
      }
      reportOptions[idx].mode = mode;
      renderReportOptionCards();
    }

    function clearReportOptionImage(idx) {
      reportOptions[idx].imgBase64 = '';
      renderReportOptionCards();
    }

    function handleReportOptionImageFile(idx, event) {
      const file = event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('請選擇圖片格式檔案');
        return;
      }
      const reader = new FileReader();
      reader.onload = function(evt) {
        startCropSession('report', idx, evt.target.result);
      };
      reader.readAsDataURL(file);
    }

    function openCropEditorForReportOption(idx) {
      if (reportOptions[idx] && reportOptions[idx].imgBase64) {
        startCropSession('report', idx, reportOptions[idx].imgBase64);
      }
    }

    // 點擊 Modal 背景遮罩關閉
    const reportModalEl = document.getElementById('reportModal');
    if (reportModalEl) {
      reportModalEl.addEventListener('click', (e) => {
        if (e.target.id === 'reportModal') {
          closeReportModal();
        }
      });
    }

    // ESC 鍵關閉 Modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeReportModal();
        closeAddQuizModal();
        closeCropModal();
        document.querySelectorAll('.popover-bubble.show').forEach(el => el.classList.remove('show'));
        document.querySelectorAll('.arrow-btn.active').forEach(el => el.classList.remove('active'));
      }
    });

    function submitReport() {
      if (!currentReportingItem) return;

      const noteInput = document.getElementById('modalNoteInput').value.trim();

      // 檢查勾選的正解
      const correctOpt = reportOptions.find(o => o.isCorrect);
      if (!correctOpt) {
        alert('請勾選唯一一個正確答案！');
        return;
      }

      let correctVal = '';
      let ansImgBase64 = null;
      if (correctOpt.mode === 'text') {
        correctVal = (correctOpt.val || '').trim();
      } else {
        ansImgBase64 = correctOpt.imgBase64 || null;
        correctVal = (correctOpt.textDesc || '').trim();
      }

      if (!correctVal && !ansImgBase64) {
        alert('您勾選的正解尚未填寫內容或上傳圖片！請填寫正解內容。');
        return;
      }

      // 整理最多 3 個錯誤答案
      const wrongList = [];
      reportOptions.forEach(opt => {
        if (!opt.isCorrect) {
          if (opt.mode === 'text') {
            const v = (opt.val || '').trim();
            if (v) wrongList.push({ type: 'text', val: v });
          } else if (opt.mode === 'image') {
            const img = opt.imgBase64 || null;
            const desc = (opt.textDesc || '').trim();
            if (img || desc) {
              wrongList.push({ type: 'image', imageBase64: img, val: desc });
            }
          }
        }
      });

      const now = new Date();
      const timeStr = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0') + ':' +
        String(now.getSeconds()).padStart(2, '0');

      const reportPayload = {
        id: 'web_fix_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        qid: currentReportingItem.id,
        question: currentReportingItem.q,
        originalAns: currentReportingItem.ans,
        suggestedAns: correctVal || (ansImgBase64 ? '[圖片答案]' : ''),
        ansImageBase64: ansImgBase64,
        wrongOptions: wrongList,
        note: noteInput ? (noteInput + ' (來自網頁提供/修正答案)') : '來自網頁提供/修正答案',
        submittedAt: timeStr
      };

      // 1. 儲存於使用者瀏覽器 (localStorage)
      try {
        const localReports = JSON.parse(localStorage.getItem('momo_web_reports') || '[]');
        localReports.push(reportPayload);
        localStorage.setItem('momo_web_reports', JSON.stringify(localReports));
      } catch (e) {}

      // 2. 提交至伺服器端點 (經過大門伺服器 server.py 轉發至 port 9000)
      const uploadUrl = (window.location.protocol === 'file:' || !window.location.host.includes('9ysong.shop'))
        ? 'https://api.9ysong.shop/callback2/api/web-report'
        : '/callback2/api/web-report';

      fetch(uploadUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(reportPayload)
      })
      .then(res => res.json())
      .then(data => {
        console.log('[答案修正送出成功]', data);
      })
      .catch(err => {
        console.log('[答案修正暫存送出]', err);
      });

      closeReportModal();
      showToast('🎉 感謝回報！您的答案已送出，管理員在 LINE 審核確認後將即時更新至題庫！');
    }

    function showToast(text) {
      const toast = document.getElementById('toastMsg');
      if (!toast) return;

      toast.textContent = text;
      toast.classList.add('show');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Event listeners
    searchInput.addEventListener('input', updateSearch);

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      updateSearch();
    });

    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        backToTop.classList.add('show');
      } else {
        backToTop.classList.remove('show');
      }
    });

    // Infinite scroll trigger when reaching bottom
    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 400) {
        if (displayedCount < currentResults.length) {
          loadMore();
        }
      }
    });

    async function syncWithLiveDatabase() {
      const apiUrl = (window.location.protocol === 'file:' || !window.location.host.includes('9ysong.shop'))
        ? 'https://api.9ysong.shop/callback2/api/questions'
        : '/callback2/api/questions';

      try {
        const headers = {};
        if (lastDbVersion && lastDbVersion !== '0') {
          headers['If-None-Match'] = `"${lastDbVersion}"`;
        }
        const res = await fetch(apiUrl, { headers, cache: 'no-cache' });
        if (res.status === 304) {
          updateLiveBadge(true, ALL_QUESTIONS.length);
          return;
        }
        if (res.ok) {
          const data = await res.json();
          if (data && data.questions && data.questions.length > 0) {
            // 比對題目，若有答案變化或重設，清除本地過期投票
            data.questions.forEach(q => {
              VOTE_COUNTS[q.id] = { likes: q.likes || 0, dislikes: q.dislikes || 0 };
              
              const saved = USER_VOTES[q.id];
              if (saved) {
                const savedAns = typeof saved === 'object' ? saved.ans : null;
                const savedDate = typeof saved === 'object' ? saved.date : null;
                // 若伺服器上答案更新或重設讚數為0，清除本地投票使設備可重新計票
                if ((savedAns !== null && savedAns !== (q.ans || '')) ||
                    (savedDate !== null && savedDate !== (q.date || '')) ||
                    (q.likes === 0 && q.dislikes === 0 && savedAns !== null)) {
                  delete USER_VOTES[q.id];
                }
              }
            });

            ALL_QUESTIONS = data.questions;
            lastDbVersion = data.last_modified || '0';
            saveVotes();

            const totalCountEl = document.getElementById('totalQuestionsCount');
            if (totalCountEl) totalCountEl.textContent = data.questions.length.toLocaleString();
            updateSearch();
            updateLiveBadge(true, data.questions.length);
            console.log(`[即時同步] 已成功從 SQLite 資料庫同步 ${data.questions.length} 筆最新題庫！`);
          }
        }
      } catch (e) {
        console.log('[即時同步] 目前使用本地快照資料庫');
        updateLiveBadge(false, ALL_QUESTIONS.length);
      }
    }

    
    // =========================================================
    // 增加題庫與選項圖片裁切縮放編輯邏輯
    // =========================================================
    let newQuizImageBase64 = null;
    let newQuizOptions = [
      { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: true },
      { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: false },
      { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: false },
      { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: false }
    ];

    // 縮放裁切狀態
    let cropTargetOptIndex = 0;
    let cropImageObj = null;
    let cropScale = 1.0;
    let cropX = 0;
    let cropY = 0;
    let cropDragging = false;
    let cropStartX = 0;
    let cropStartY = 0;

    function openAddQuizModal() {
      const query = (searchInput.value || '').trim();
      document.getElementById('newQText').value = query;
      clearNewQImage();
      document.getElementById('newQNote').value = '';

      // 初始化 4 個選項，預設選項 A 為正解
      newQuizOptions = [
        { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: true },
        { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: false },
        { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: false },
        { mode: 'text', val: '', imgBase64: '', textDesc: '', isCorrect: false }
      ];
      renderOptionCards();

      const modal = document.getElementById('addQuizModal');
      if (modal) {
        modal.style.display = 'flex';
        setTimeout(() => {
          const qInput = document.getElementById('newQText');
          if (qInput) qInput.focus();
        }, 60);
      }
    }

    function closeAddQuizModal() {
      const modal = document.getElementById('addQuizModal');
      if (modal) modal.style.display = 'none';
      clearNewQImage();
    }

    // 題目圖片上傳處理
    function handleNewQImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('請選擇圖片格式 (PNG, JPG, WebP 等)');
        return;
      }
      const reader = new FileReader();
      reader.onload = function(evt) {
        newQuizImageBase64 = evt.target.result;
        document.getElementById('newQImagePreviewImg').src = newQuizImageBase64;
        document.getElementById('newQImagePreviewContainer').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearNewQImage() {
      newQuizImageBase64 = null;
      const fileInput = document.getElementById('newQImageFile');
      if (fileInput) fileInput.value = '';
      const previewContainer = document.getElementById('newQImagePreviewContainer');
      if (previewContainer) previewContainer.style.display = 'none';
    }

    // 渲染 4 個選項卡片
    function renderOptionCards() {
      const container = document.getElementById('optionCardsContainer');
      if (!container) return;

      const labels = ['選項 A', '選項 B', '選項 C', '選項 D'];
      container.innerHTML = '';

      newQuizOptions.forEach((opt, idx) => {
        const card = document.createElement('div');
        card.className = `opt-card ${opt.isCorrect ? 'is-correct-card' : ''}`;

        // 頂部列：正解勾選 Radio + 標籤 + 模式切換按鈕
        const isCorrectHtml = opt.isCorrect 
          ? `<span class="opt-status-badge correct">⭕ 唯一正解</span>`
          : `<span class="opt-status-badge wrong">❌ 錯誤答案</span>`;

        let bodyHtml = '';
        if (opt.mode === 'text') {
          bodyHtml = `
            <input type="text" 
                   class="form-input" 
                   id="optValInput_${idx}" 
                   placeholder="輸入 ${labels[idx]} 文字內容（例如：商品名、答案詞彙）..." 
                   value="${escapeHtml(opt.val)}" 
                   oninput="newQuizOptions[${idx}].val = this.value"
                   autocomplete="off">
          `;
        } else {
          // 圖片模式：左邊圖片/上傳按鈕，右邊輸入文字敘述
          let leftHtml = '';
          if (opt.imgBase64) {
            leftHtml = `
              <div class="opt-img-left">
                <img src="${opt.imgBase64}" class="opt-img-thumb" alt="選項圖片">
                <div style="display: flex; flex-direction: column; gap: 4px;">
                  <button type="button" class="opt-act-btn" onclick="openCropEditorForOption(${idx})">
                    ✂️ 放大/縮小範圍
                  </button>
                  <button type="button" class="opt-act-btn" onclick="clearOptionImage(${idx})" style="color: #ef4444;">
                    🗑️ 移除圖片
                  </button>
                </div>
              </div>
            `;
          } else {
            leftHtml = `
              <div class="opt-img-left">
                <button type="button" class="opt-act-btn" onclick="document.getElementById('optFileInput_${idx}').click()" style="background: #0284c7; color: #fff; border-color: #0284c7; padding: 7px 12px;">
                  📷 選擇圖片並裁切範圍
                </button>
                <input type="file" id="optFileInput_${idx}" accept="image/*" style="display:none;" onchange="handleOptionImageFile(${idx}, event)">
              </div>
            `;
          }

          bodyHtml = `
            <div class="opt-img-row">
              ${leftHtml}
              <div class="opt-img-right">
                <input type="text" 
                       class="form-input" 
                       id="optTextDesc_${idx}" 
                       placeholder="輸入文字敘述（例如：左下黑 右上白、粉紅瓶子等）..." 
                       value="${escapeHtml(opt.textDesc || '')}" 
                       oninput="newQuizOptions[${idx}].textDesc = this.value"
                       autocomplete="off">
                <div class="opt-desc-tip">
                  💡 說明：輸入文字敘述讓別人能夠不看圖片就知道答案
                </div>
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="opt-card-header">
            <label class="opt-radio-wrapper" onclick="setCorrectOption(${idx})">
              <input type="radio" name="optCorrectRadio" id="optRadio_${idx}" ${opt.isCorrect ? 'checked' : ''} style="cursor: pointer; accent-color: #16a34a;">
              <span style="font-weight: 800; font-size: 0.9rem; color: #1e293b;">${labels[idx]}</span>
              ${isCorrectHtml}
            </label>
            <div class="opt-mode-tabs">
              <button type="button" class="opt-mode-btn ${opt.mode === 'text' ? 'active' : ''}" onclick="switchOptionMode(${idx}, 'text')">📝 文字</button>
              <button type="button" class="opt-mode-btn ${opt.mode === 'image' ? 'active' : ''}" onclick="switchOptionMode(${idx}, 'image')">🖼️ 圖片</button>
            </div>
          </div>
          <div>${bodyHtml}</div>
        `;

        container.appendChild(card);
      });
    }

    function setCorrectOption(targetIdx) {
      newQuizOptions.forEach((opt, idx) => {
        opt.isCorrect = (idx === targetIdx);
      });
      renderOptionCards();
    }

    function switchOptionMode(idx, mode) {
      if (mode === 'image' && !newQuizOptions[idx].textDesc && newQuizOptions[idx].val) {
        newQuizOptions[idx].textDesc = newQuizOptions[idx].val;
      } else if (mode === 'text' && !newQuizOptions[idx].val && newQuizOptions[idx].textDesc) {
        newQuizOptions[idx].val = newQuizOptions[idx].textDesc;
      }
      newQuizOptions[idx].mode = mode;
      renderOptionCards();
    }

    function clearOptionImage(idx) {
      newQuizOptions[idx].imgBase64 = '';
      renderOptionCards();
    }

    // 處理選擇選項圖片
    function handleOptionImageFile(idx, event) {
      const file = event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('請選擇圖片格式檔案');
        return;
      }
      const reader = new FileReader();
      reader.onload = function(evt) {
        startCropSession(idx, evt.target.result);
      };
      reader.readAsDataURL(file);
    }

    function openCropEditorForOption(idx) {
      if (newQuizOptions[idx] && newQuizOptions[idx].imgBase64) {
        startCropSession(idx, newQuizOptions[idx].imgBase64);
      }
    }

    let cropContext = 'add'; // 'add' 或 'report'

    // 啟動圖片範圍裁切工作台 (支援增加題庫與修正答案兩種模式)
    function startCropSession(contextOrIdx, idxOrDataUrl, optionalDataUrl) {
      if (typeof contextOrIdx === 'string') {
        cropContext = contextOrIdx;
        cropTargetOptIndex = idxOrDataUrl;
        var dataUrl = optionalDataUrl;
      } else {
        cropContext = 'add';
        cropTargetOptIndex = contextOrIdx;
        var dataUrl = idxOrDataUrl;
      }
      const img = new Image();
      img.onload = function() {
        cropImageObj = img;
        cropScale = 1.0;
        cropX = 0;
        cropY = 0;
        document.getElementById('cropZoomSlider').value = 1.0;
        document.getElementById('cropModal').style.display = 'flex';
        initCropCanvasListeners();
        drawCropCanvas();
      };
      img.src = dataUrl;
    }

    function closeCropModal() {
      const modal = document.getElementById('cropModal');
      if (modal) modal.style.display = 'none';
    }

    function drawCropCanvas() {
      const canvas = document.getElementById('cropCanvas');
      if (!canvas || !cropImageObj) return;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 計算以 Canvas 中心點為基準的縮放與平移
      const drawW = cropImageObj.width * cropScale;
      const drawH = cropImageObj.height * cropScale;
      const drawX = (canvas.width - drawW) / 2 + cropX;
      const drawY = (canvas.height - drawH) / 2 + cropY;

      ctx.drawImage(cropImageObj, drawX, drawY, drawW, drawH);
    }

    function onCropSliderChange(val) {
      cropScale = parseFloat(val);
      drawCropCanvas();
    }

    function adjustCropZoom(delta) {
      const slider = document.getElementById('cropZoomSlider');
      let val = parseFloat(slider.value) + delta;
      val = Math.max(0.3, Math.min(3.5, val));
      slider.value = val.toFixed(2);
      cropScale = val;
      drawCropCanvas();
    }

    function resetCropView() {
      cropScale = 1.0;
      cropX = 0;
      cropY = 0;
      document.getElementById('cropZoomSlider').value = 1.0;
      drawCropCanvas();
    }

    let cropListenersBound = false;
    function initCropCanvasListeners() {
      if (cropListenersBound) return;
      cropListenersBound = true;

      const canvas = document.getElementById('cropCanvas');
      if (!canvas) return;

      canvas.addEventListener('mousedown', (e) => {
        cropDragging = true;
        cropStartX = e.clientX - cropX;
        cropStartY = e.clientY - cropY;
        canvas.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', (e) => {
        if (!cropDragging) return;
        cropX = e.clientX - cropStartX;
        cropY = e.clientY - cropStartY;
        drawCropCanvas();
      });

      window.addEventListener('mouseup', () => {
        cropDragging = false;
        canvas.style.cursor = 'grab';
      });

      // 觸控支援 (手機/平板)
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          cropDragging = true;
          cropStartX = e.touches[0].clientX - cropX;
          cropStartY = e.touches[0].clientY - cropY;
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (!cropDragging || e.touches.length !== 1) return;
        cropX = e.touches[0].clientX - cropStartX;
        cropY = e.touches[0].clientY - cropStartY;
        drawCropCanvas();
      }, { passive: true });

      canvas.addEventListener('touchend', () => {
        cropDragging = false;
      });
    }

    function applyCroppedImage() {
      const canvas = document.getElementById('cropCanvas');
      if (!canvas) return;
      const croppedBase64 = canvas.toDataURL('image/jpeg', 0.88);

      if (cropContext === 'report') {
        reportOptions[cropTargetOptIndex].imgBase64 = croppedBase64;
        closeCropModal();
        renderReportOptionCards();
        showToast('✅ 修正選項圖片範圍已成功裁切套用！');
      } else {
        newQuizOptions[cropTargetOptIndex].imgBase64 = croppedBase64;
        closeCropModal();
        renderOptionCards();
        showToast('✅ 選項圖片範圍已成功裁切套用！');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 送出新增題庫
    function submitNewQuiz() {
      const qText = (document.getElementById('newQText').value || '').trim();
      const note = (document.getElementById('newQNote').value || '').trim();

      if (!qText && !newQuizImageBase64) {
        alert('請輸入題目內容，或上傳題目原圖截圖！');
        document.getElementById('newQText').focus();
        return;
      }

      // 檢查勾選的正解
      const correctOpt = newQuizOptions.find(o => o.isCorrect);
      if (!correctOpt) {
        alert('請勾選唯一一個正確答案！');
        return;
      }

      let correctVal = '';
      let ansImgBase64 = null;
      if (correctOpt.mode === 'text') {
        correctVal = (correctOpt.val || '').trim();
      } else {
        ansImgBase64 = correctOpt.imgBase64 || null;
        correctVal = (correctOpt.textDesc || '').trim();
      }

      if (!correctVal && !ansImgBase64) {
        alert('您勾選的正解尚未填寫內容或上傳圖片！請填寫正解選項。');
        return;
      }

      // 整理最多 3 個錯誤答案
      const wrongList = [];
      newQuizOptions.forEach(opt => {
        if (!opt.isCorrect) {
          if (opt.mode === 'text') {
            const v = (opt.val || '').trim();
            if (v) wrongList.push({ type: 'text', val: v });
          } else if (opt.mode === 'image') {
            const img = opt.imgBase64 || null;
            const desc = (opt.textDesc || '').trim();
            if (img || desc) {
              wrongList.push({ type: 'image', imageBase64: img, val: desc });
            }
          }
        }
      });

      const now = new Date();
      const timeStr = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0') + ':' +
        String(now.getSeconds()).padStart(2, '0');

      const payload = {
        id: 'web_add_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        qid: null, // 全新新題
        question: qText,
        suggestedAns: correctVal || (ansImgBase64 ? '[圖片答案]' : ''),
        ansImageBase64: ansImgBase64,
        imageBase64: newQuizImageBase64,
        wrongOptions: wrongList,
        note: note ? (note + ' (來自網頁「找不到嗎？請幫忙增加題庫」)') : '來自網頁「找不到嗎？請幫忙增加題庫」',
        submittedAt: timeStr
      };

      const uploadUrl = (window.location.protocol === 'file:' || !window.location.host.includes('9ysong.shop'))
        ? 'https://api.9ysong.shop/callback2/api/web-report'
        : '/callback2/api/web-report';

      fetch(uploadUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        console.log('[新題增加送出成功]', data);
      })
      .catch(err => {
        console.log('[新題增加已暫存送出]', err);
      });

      closeAddQuizModal();
      showToast('🎉 感謝您的熱心提供！新題目已送出審核，管理員在 LINE 核准後將自動同步加入題庫！');
    }

    function updateLiveBadge(isOnline, count) {
      const badge = document.getElementById('dbSyncBadge');
      if (!badge) return;
      if (isOnline) {
        badge.className = 'db-sync-badge online';
        badge.innerHTML = `<span class="badge-dot"></span> 資料庫即時連線 (${count}題)`;
        badge.title = '已連線至 SQLite 題庫，任何在 LINE 或線上的更新將即時同步！';
      } else {
        badge.className = 'db-sync-badge offline';
        badge.innerHTML = `<span class="badge-dot"></span> 本地快照模式 (${count}題)`;
        badge.title = '目前使用離線/快照題庫，連線伺服器後將自動即時同步最新資料。';
      }
    }

    // Initial load
    updateSearch();
    syncWithLiveDatabase();
    // 每 30 秒自動檢測資料庫是否有題目/答案更新 (304 Not Modified 極速無負擔)
    setInterval(syncWithLiveDatabase, 30000);
  </script>
