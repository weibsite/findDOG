<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fff; margin: 0; padding: 0; color: #111; -webkit-tap-highlight-color: transparent; }
  .container { width: 100%; max-width: 480px; margin: 0 auto; background: #fff; padding: 0 15px 80px 15px; box-sizing: border-box; }
  
  .app-header { display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #fff; z-index: 100; padding: 15px; border-bottom: 1px solid #eee; margin-bottom: 15px; font-size: 18px; font-weight: bold; margin-left: -15px; margin-right: -15px; }
  .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #111; padding: 0; line-height: 1; width: 30px; text-align: left; }
  .header-title { flex: 1; text-align: center; }
  .cart-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #111; padding: 0; line-height: 1; width: 30px; text-align: right; position: relative; }
  .cart-badge { position: absolute; top: -5px; right: -8px; background: #d32f2f; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 10px; display: none; font-weight: bold; }
  
  h1 { display: none; }
  
  .spinner { width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top: 3px solid #06c167; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  
  .section { padding: 15px; border: 1px solid #eee; border-radius: 12px; margin-bottom: 15px; background: #fafafa; }
  .section-title { font-size: 14px; font-weight: bold; color: #666; margin-bottom: 10px; }
  
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; padding: 14px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; outline: none; width: 100%; box-sizing: border-box; }
  .input-row input::-webkit-calendar-picker-indicator { opacity: 1; color: #999; cursor: pointer; }
  .input-row button { padding: 14px 16px; font-size: 15px; background: #111; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; white-space: nowrap; }
  .input-row button.secondary { background: #e0e0e0; color: #111; }

  .addr-results { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .addr-item { padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: #fff; font-size: 14px; }
  
  /* Mobile list layout for cards */
  .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
  .card { border: 1px solid #eee; border-radius: 12px; overflow: hidden; cursor: pointer; padding-bottom: 12px; background: #fff; }
  .card-img { width: 100%; height: 180px; background: #eee center/cover no-repeat; }
  .card-body { padding: 12px 12px 0 12px; }
  .card-name { font-size: 18px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { font-size: 14px; color: #666; }
  
  .status { margin-top: 10px; font-size: 15px; color: #666; text-align: center; margin-bottom: 20px;}
  .error { color: #d32f2f; }
  
  /* Navigation */
  .store-nav { display: none; } /* Removed old store-nav */
  .store-header { text-align: center; margin-bottom: 20px; }
  .store-header img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 1px solid #eee;}
  
  .menu-category { margin-top: 25px; margin-bottom: 15px; font-size: 22px; font-weight: bold; padding-bottom: 10px; }
  .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
  .menu-item { border: 1px solid #ddd; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 12px; background: #fff; cursor: pointer;}
  .menu-item-info { flex: 1; }
  .menu-item-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
  .menu-item-desc { font-size: 13px; color: #666; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .menu-item-price { font-weight: bold; font-size: 15px; color: #111; }
  .menu-item-img { width: 90px; height: 90px; background: #eee center/cover no-repeat; border-radius: 8px; flex-shrink: 0; }

  /* Bottom sheet style modal */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: flex-end; justify-content: center; }
  .modal { background: #fff; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; overflow: hidden; display: flex; flex-direction: column; max-height: 85vh; animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-img { width: 100%; height: 200px; background: #eee center/cover no-repeat; }
  .modal-body { padding: 20px; overflow-y: auto; padding-bottom: 30px; }
  .modal-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
  .modal-desc { font-size: 14px; color: #666; margin-bottom: 20px; }
  .modal-section { margin-bottom: 20px; }
  .modal-section h4 { margin: 0 0 10px 0; font-size: 16px; }
  .modal-textarea { width: 100%; height: 80px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; resize: none; font-family: inherit; box-sizing: border-box;}
  .modal-footer { padding: 15px 20px 25px 20px; border-top: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; gap: 15px; background: #fff;}
  
  .qty-controls { display: flex; align-items: center; gap: 15px; font-weight: bold; font-size: 18px;}
  .qty-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: #f0f0f0; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;}
  .add-btn { flex: 1; padding: 14px; background: #111; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .close-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.9); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10;}

  /* Floating Cart Button */
  .floating-cart { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 440px; background: #06c167; color: #fff; text-align: center; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 15px rgba(6, 193, 103, 0.4); border: none; cursor: pointer; z-index: 900; display: none; }
  /* Floating Cart Button */
  .floating-cart { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 440px; background: #06c167; color: #fff; text-align: center; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 15px rgba(6, 193, 103, 0.4); border: none; cursor: pointer; z-index: 900; display: none; }
  
  /* Beverage Shop Mode */
  .store-layout-2col { display: flex; gap: 12px; align-items: flex-start; }
  .store-sidebar { width: 85px; flex-shrink: 0; position: sticky; top: 75px; height: calc(100vh - 90px); overflow-y: auto; background: #f9f9f9; border-radius: 8px; scrollbar-width: none; }
  .store-sidebar::-webkit-scrollbar { display: none; }
  .store-sidebar-item { padding: 15px 8px; font-size: 13px; color: #666; cursor: pointer; text-align: center; border-left: 3px solid transparent; transition: all 0.2s; }
  .store-sidebar-item.active { background: #fff; color: #111; font-weight: bold; border-left: 3px solid #06c167; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  .store-main-list { flex: 1; min-width: 0; }
  .store-top-nav { display: flex; overflow-x: auto; gap: 8px; padding: 5px 0 15px 0; margin-bottom: 10px; border-bottom: 1px solid #eee; scrollbar-width: none; }
  .store-top-nav::-webkit-scrollbar { display: none; }
  .store-top-nav button { white-space: nowrap; padding: 6px 14px; background: #f0f0f0; border: none; border-radius: 20px; font-size: 14px; font-weight: bold; color: #333; cursor: pointer; }
  .store-top-nav button:active { background: #e0e0e0; }
</style>

<script>
  let API_BASE_URL = '';
  let WS_URL = '';
  
  // 動態取得預設的連線位置
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const host = window.location.hostname || '127.0.0.1';
  WS_URL = `${protocol}//${host}:8000/ws`;
  
  // 設備檢測機制 (判斷是手機還是電腦)
const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
const isDesktopDevice = !isMobileDevice;

function copyToClipboardFallback(text, btn) {
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
    } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch(e){}
        document.body.removeChild(ta);
    }
    if (btn) {
        btn.innerText = '已複製！請貼上至官方帳號';
        btn.style.background = '#06c167';
        btn.style.color = '#fff';
    }
}

let isAddressSet = false;
  let currentLat = null;
  let currentLng = null;
  let currentAddrTitle = '';
  let scheduleMode = 'SCHEDULE';
  let selectedDateIndex = 0;
  const datesData = [];
  
  // ====== History Logic ======
  let addressHistory = [];
  
  function loadHistory() {
    ['foodNotes', 'deliveryNotes', 'query'].forEach(field => {
      const history = JSON.parse(localStorage.getItem('finddog_history_' + field)) || [];
      const datalist = document.getElementById(field === 'query' ? 'query-list' : (field === 'foodNotes' ? 'food-notes-list' : 'delivery-notes-list'));
      if (datalist) {
        datalist.innerHTML = history.map(val => `<option value="${escapeHTML(val)}"></option>`).join('');
      }
      if (history.length > 0 && field !== 'query') {
        document.getElementById(field).value = history[0];
      }
    });
    
    addressHistory = JSON.parse(localStorage.getItem('finddog_history_address')) || [];
    const addrDatalist = document.getElementById('addr-list');
    if (addrDatalist) {
      addrDatalist.innerHTML = addressHistory.map(item => `<option value="${escapeHTML(item.title)}"></option>`).join('');
    }
    
    if (addressHistory.length > 0 && !isAddressSet) {
      const lastAddr = addressHistory[0];
      document.getElementById('addrInput').value = lastAddr.title;
      scrollAddrToEnd();
      setAddress(lastAddr.lat, lastAddr.lng, lastAddr.title);
    }
  }

  function saveSimpleHistory(field) {
    const val = document.getElementById(field).value.trim();
    if (!val) return;
    let history = JSON.parse(localStorage.getItem('finddog_history_' + field)) || [];
    history = history.filter(item => item !== val);
    history.unshift(val);
    if (history.length > 5) history = history.slice(0, 5);
    localStorage.setItem('finddog_history_' + field, JSON.stringify(history));
    loadHistory();
  }

  function saveAddressHistory(lat, lng, title) {
    let history = JSON.parse(localStorage.getItem('finddog_history_address')) || [];
    history = history.filter(item => item.title !== title);
    history.unshift({ lat, lng, title });
    if (history.length > 5) history = history.slice(0, 5);
    localStorage.setItem('finddog_history_address', JSON.stringify(history));
    addressHistory = history;
    loadHistory();
  }

  // 初始化 UI 與設定
  let liffInitPromise = null;
  document.addEventListener("DOMContentLoaded", async () => {
    liffInitPromise = liff.init({ liffId: "2011657436-rGVj5SoG" }).catch(err => {
        console.error('LIFF init failed', err);
    });
    
    try {
      const configRes = await fetch('config.json?t=' + Date.now());
      if (configRes.ok) {
        const configData = await configRes.json();
        if (configData.api_url) {
          API_BASE_URL = configData.api_url.replace(/\/$/, '');
        } else if (configData.line_url) {
          API_BASE_URL = configData.line_url.replace(/\/$/, '');
        }
        if (configData.ws_url) WS_URL = configData.ws_url;
      }
    } catch (e) {
      console.log('找不到 config.json，將使用預設路徑。');
    }
    
    // Config 讀取完成後，再讀取歷史紀錄 (這樣 auto-setAddress 才會用到正確的 API_BASE_URL)
    loadHistory();
    initSchedulePicker();
  });

  function initSchedulePicker() {
    const today = new Date();
    const daysStr = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const dateBtns = document.getElementById('dateButtons');
    dateBtns.innerHTML = '';

    for (let i = 0; i < 7; i++) {
      let d = new Date(today);
      d.setDate(today.getDate() + i);
      
      let label = `${d.getMonth()+1}月${d.getDate()}日`;
      let dayName = daysStr[d.getDay()];
      if (i === 0) dayName = '今天';
      if (i === 1) dayName = '明天';

      datesData.push(d);
      
      const btn = document.createElement('button');
      btn.innerHTML = `<div style="font-size:12px; color:#666;">${dayName}</div><div style="font-size:14px; font-weight:bold;">${label}</div>`;
      btn.style.cssText = `min-width:80px; padding:8px; border-radius:8px; border:2px solid ${i === 0 ? '#000' : '#eee'}; background:#fff; cursor:pointer; text-align:center;`;
      btn.onclick = () => selectDate(i);
      btn.id = `dateBtn_${i}`;
      dateBtns.appendChild(btn);
    }
    generateTimeSlots();
  }

  function selectDate(idx) {

  function generateTimeSlots() {
    const timeSelect = document.getElementById('scheduleTime');
    timeSelect.innerHTML = '';
    
    const targetDate = datesData[selectedDateIndex];
    const now = new Date();
    
    let startHour = 0;
    let startMin = 0;
    
    // 如果是今天，從現在的下一個小時開始
    if (selectedDateIndex === 0) {
      startHour = now.getHours() + 1;
      startMin = Math.ceil(now.getMinutes() / 15) * 15;
      if (startMin >= 60) {
        startHour++;
        startMin = 0;
      }
    }

    for (let h = startHour; h < 24; h++) {
      for (let m = (h === startHour ? startMin : 0); m < 60; m += 15) {
        // 建立 30 分鐘的區間
        let endH = h;
        let endM = m + 30;
        if (endM >= 60) { endH++; endM -= 60; }
        if (endH >= 24) continue;
        
        const formatTime = (hour, min) => {
          const ampm = hour >= 12 ? '下午' : '上午';
          const h12 = hour % 12 || 12;
          const mm = min.toString().padStart(2, '0');
          return `${getTimeEmoji(hour)} ${ampm} ${h12}:${mm}`;
        };

        const tStart = formatTime(h, m);
        const tEnd = formatTime(endH, endM);

        const valDate = new Date(targetDate);
        valDate.setHours(h, m, 0, 0);
        
        // 為了模擬時區不偏差，使用本地時間組裝字串或保留 ISO 格式
        const tzo = -valDate.getTimezoneOffset() / 60;
        const sign = tzo >= 0 ? '+' : '-';
        const pad = n => String(Math.floor(Math.abs(n))).padStart(2, '0');
        const isoLocal = valDate.getFullYear() + '-' + pad(valDate.getMonth()+1) + '-' + pad(valDate.getDate()) + 'T' + pad(valDate.getHours()) + ':' + pad(valDate.getMinutes()) + ':00' + sign + pad(tzo) + ':00';

        const opt = document.createElement('option');
        opt.value = isoLocal; // 用完整的時間字串
              const startAmpm = h >= 12 ? '下午' : '上午';
              const endAmpm = endH >= 12 ? '下午' : '上午';
              const startH12 = h % 12 || 12;
              const endH12 = endH % 12 || 12;
              const startMM = m.toString().padStart(2, '0');
              const endMM = endM.toString().padStart(2, '0');
              const datePrefix = selectedDateIndex === 0 ? '' : `(${targetDate.getMonth()+1}/${targetDate.getDate()}) `;
              if (startAmpm === endAmpm) {
                opt.innerText = `${datePrefix}${getTimeEmoji(h)} ${startAmpm} ${startH12}:${startMM}-${endH12}:${endMM}`;
              } else {
                opt.innerText = `${datePrefix}${getTimeEmoji(h)} ${startAmpm} ${startH12}:${startMM} – ${getTimeEmoji(endH)} ${endAmpm} ${endH12}:${endMM}`;
              }
        timeSelect.appendChild(opt);
      }
    }
    
    if (timeSelect.options.length === 0) {
      const opt = document.createElement('option');
      opt.value = "";
      opt.innerText = "今日已無可用時段";
      timeSelect.appendChild(opt);
    }
  }

  function formatNominatimAddress(item) {
      if (item.address) {
          const ad = item.address;
          const city = ad.city || ad.county || ad.state || '';
          const district = ad.city_district || ad.town || ad.village || ad.suburb || ad.district || ad.borough || '';
          const road = ad.road || ad.pedestrian || ad.street || '';
          const house = ad.house_number || '';
          if (city || district || road) {
              return `${city}${district}${road}${house}`;
          }
      }
      return item.display_name.split(',')[0];
  }

  async function searchAddress(force = false) {
    let q = document.getElementById('addrInput').value.trim();
    if (!force && q === window.lastSearchedAddr) return;
    window.lastSearchedAddr = q;

    if (q.startsWith('📍 ')) q = q.substring(3).trim();
    if (!q) { updateAddrTitleState('default'); return; }




    
    // Check if it's already in history to skip server searching
    const matchedHistory = addressHistory.find(item => item.title === q);
    if (matchedHistory) {
      setAddress(matchedHistory.lat, matchedHistory.lng, matchedHistory.title);
      return;
    }
    
    const statusEl = document.getElementById('addrStatus');
    const resultsEl = document.getElementById('addrResults');
    statusEl.innerText = ''; 
    resultsEl.innerHTML = '';

    const fallbackSearch = async () => {
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=tw&q=${encodeURIComponent(q)}&accept-language=zh-TW&addressdetails=1`);
        const data = await res.json();
        if (data.length === 0) {
            statusEl.innerText = '找不到地址';
            return;
        }
        if (data.length === 1) {
            setAddress(data[0].lat, data[0].lon, formatNominatimAddress(data[0]));
        } else {
            statusEl.innerText = '請選擇精確地址：';
            resultsEl.innerHTML = data.slice(0, 5).map(item => {
                const formatted = formatNominatimAddress(item);
                return `<div class="addr-item" onclick="setAddress(${item.lat}, ${item.lon}, '${escapeHTML(formatted)}')">
                    ${escapeHTML(formatted)}
                </div>`;
            }).join('');
        }
    } catch (e) {
        statusEl.innerText = '搜尋地址錯誤: ' + e.message;
        updateAddrTitleState('error');
    }
    if (btn2) { btn2.disabled = false; btn2.style.opacity = '1'; btn2.style.cursor = 'pointer'; }
    };
    // 前端防呆：如果字串是以「路、街、巷、弄、段」結尾，代表 100% 沒有門牌號碼
    if (/[\u8def\u8857\u5df7\u5f04\u6bb5]$/.test(q)) {
        document.getElementById('addrStatus').innerText = '請輸入包含「門牌號碼」的完整地址，不能僅輸入到路名';
        updateAddrTitleState('error');
        document.getElementById('addrResults').innerHTML = '';
        const btn = document.getElementById('searchAddrBtn');
        const btn2 = document.getElementById('searchStoresBtn');
        btn.disabled = false;
        if (btn2) { btn2.disabled = false; btn2.style.opacity = '1'; btn2.style.cursor = 'pointer'; }
        return;
    }

    
    try {
      // 先使用 Nominatim 進行「模糊地址」過濾（防止只輸入台北市、南屯區）
      try {
          const nomRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=tw&q=${encodeURIComponent(q)}&accept-language=zh-TW&addressdetails=1`);
          const nomData = await nomRes.json();
          if (nomData.length > 0) {
              const bestMatch = nomData[0];
              if (bestMatch.class === 'boundary' || bestMatch.type === 'administrative' || bestMatch.class === 'highway') {
                  document.getElementById('addrStatus').innerText = '請輸入包含「門牌號碼」的完整地址 (例: 臺北市中正區重慶南路一段122號) 或具體地標 (例: 台北車站)';
                  updateAddrTitleState('error');
                  document.getElementById('addrResults').innerHTML = '';
                  const btn = document.getElementById('searchAddrBtn');
                  const btn2 = document.getElementById('searchStoresBtn');
                  btn.disabled = false;
                  if (btn2) { btn2.disabled = false; btn2.style.opacity = '1'; btn2.style.cursor = 'pointer'; }
                  return;
              }
          }
      } catch(e) {} // 如果 Nominatim 掛掉，就直接放行給 Google WS
      
      const ws = new WebSocket(WS_URL);
      let resolved = false;
      
      const timeoutId = setTimeout(() => {
        if (!resolved) {
          resolved = true;
          ws.close();
          fallbackSearch();
        }
      }, 15000);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'search_address', address: q }));
      };

      ws.onmessage = (event) => {
        if (resolved) return;
        const data = JSON.parse(event.data);
        if (data.type === 'search_address_result') {
          resolved = true;
          clearTimeout(timeoutId);
          ws.close();
          if (data.success && data.lat && data.lng) {
            setAddress(data.lat, data.lng, q);
          } else {
            fallbackSearch();
          }
        }
      };

      ws.onerror = (e) => {
        if (!resolved) {
          resolved = true;
          clearTimeout(timeoutId);
          fallbackSearch();
        }
      };
    } catch (e) { 
        fallbackSearch();
    }
  }

  async function setAddress(lat, lng, title) {

    document.getElementById('addrInput').value = displayTitle;
    scrollAddrToEnd();
    currentLat = lat;
    currentLng = lng;
    currentAddrTitle = displayTitle;
    try {
      const res = await fetch(`${API_BASE_URL}/api/set-address`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lat, lng, title })
      });
      const json = await res.json();
      if (json.status === 'success') {
          // 不顯示成功訊息，讓使用者感覺無縫銜接
          isAddressSet = true;
          saveAddressHistory(lat, lng, title);
        updateAddrTitleState('ok');
      } else {
          statusEl.innerText = '❌ 設定失敗: ' + json.message;
        updateAddrTitleState('error');
      }
    } catch (e) { 
        statusEl.innerText = '❌ 連線伺服器失敗: ' + e.message;
      updateAddrTitleState('error'); 
    }
  }

    const q = document.getElementById('query').value.trim();
    window.lastListSearchKeyword = q;

    // 切換到 ListView

    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    statusEl.innerHTML = '<div class="spinner" style="margin: 0 auto;"></div><div style="margin-top: 10px;">搜尋中...</div>'; statusEl.className = 'status'; resultsEl.innerHTML = '';
    
    try {
      const res = await fetch(`${API_BASE_URL}/api/search`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q })
      });
      const json = await res.json();
      if (!res.ok || json.status === 'failure') { statusEl.innerHTML = '搜尋失敗'; return; }
      
      const stores = (json.data.feedItems || []).filter(i => i.type === 'REGULAR_STORE' && i.store).map(i => i.store);
      if (stores.length === 0) { statusEl.innerHTML = '找不到相關餐廳。'; return; }
      
      const unSchedulableStores = JSON.parse(localStorage.getItem('unSchedulableStores') || '[]');

        const rating = s.rating ? s.rating.text : '無評價';
        const name = s.title ? s.title.text : '未知餐廳';
        
        const isBad = unSchedulableStores.includes(s.storeUuid);

      }).join('');

function handleStoreSearch(isUserInput = false) {
  const keyword = document.getElementById('storeSearchInput').value.trim().toLowerCase();
  
  if (currentView === 'list') {
      const cards = document.querySelectorAll('#results .card');
      cards.forEach(card => {
          const name = card.querySelector('.card-name') ? card.querySelector('.card-name').innerText.toLowerCase() : '';
          if (name.includes(keyword)) {
              card.style.display = '';
          } else {
              card.style.display = 'none';
          }
      });
      
      if (isUserInput) {
          clearTimeout(window.listSearchDebounceTimer);
          window.listSearchDebounceTimer = setTimeout(() => {
              triggerListSearch(false);
          }, 1200);
      }
      return;
  }
  
  const results = document.getElementById('storeSearchResults');
  
  if (!keyword) {
    results.innerHTML = '';
    return;
  }
  
  if (!window.currentStoreRawData) return;
  const d = window.currentStoreRawData;
  const storeUuid = d.uuid;
  
  let html = '<div class="menu-grid">';
  let found = 0;
  
  if (d.catalogSectionsMap) {
    Object.keys(d.catalogSectionsMap).forEach(key => {
      const sectionArr = d.catalogSectionsMap[key];
      sectionArr.forEach(section => {
        const secUuid = key;
        const subsecUuid = section.catalogSectionUUID || '';
        if (section.payload && section.payload.standardItemsPayload) {
          const items = section.payload.standardItemsPayload.catalogItems || [];
          items.forEach(item => {
            const itemTitle = (typeof filterTrailingEnglish === 'function') ? filterTrailingEnglish(parseText(item.title)) : parseText(item.title) || '';
            const itemDesc = (typeof filterTrailingEnglish === 'function') ? filterTrailingEnglish(parseText(item.itemDescription)) : parseText(item.itemDescription) || '';
            
            if (itemTitle.toLowerCase().includes(keyword) || itemDesc.toLowerCase().includes(keyword)) {
                const priceVal = item.price > 0 ? Math.round(item.price / 100) : 0;
                let priceHtml = priceVal > 0 ? '$' + priceVal : '';
                if (item.priceTagline && item.priceTagline.textFormat) {
                  priceHtml = item.priceTagline.textFormat;
                }
                if (item.isSoldOut) priceHtml = '<span style="color:#d32f2f;">已售完</span>';
                
                const imgUrl = item.imageUrl || '';
                
                let isPromo = false;
                try {
                  if (item.promoInfo && item.promoInfo.promoBadge && item.promoInfo.promoBadge.content && item.promoInfo.promoBadge.content.richText) {
                    const elements = item.promoInfo.promoBadge.content.richText.richTextElements;
                    if (elements && elements.length > 0 && elements[0].text && elements[0].text.text && elements[0].text.text.text) {
                      const txt = elements[0].text.text.text;
                      if (txt.includes('買 1 送 1') || txt.includes('免費商品')) {
                         isPromo = true;
                      }
                    }
                  }
                } catch(e) {}
                
                if (!isPromo) {
                  found++;
                  let itemHtml = '<div class="menu-item" style="position: relative;" onclick="toggleStoreSearch(); openItemModal(\'' + storeUuid + '\', \'' + secUuid + '\', \'' + subsecUuid + '\', \'' + item.uuid + '\', \'' + encodeURIComponent(itemTitle).replace(/'/g, "%27") + '\', \'' + encodeURIComponent(itemDesc).replace(/'/g, "%27") + '\', ' + priceVal + ', \'' + imgUrl + '\')">';
                  itemHtml += '<div class="menu-item-info">';
                  itemHtml += '<div class="menu-item-title">' + escapeHTML(itemTitle) + '</div>';
                  itemHtml += '<div class="menu-item-desc">' + escapeHTML(itemDesc) + '</div>';
                  itemHtml += '<div class="menu-item-price">' + priceHtml + '</div>';

async function handleQuickAdd(event, storeUuid, sectionUuid, subsectionUuid, menuItemUuid, titleEnc, descEnc, basePrice, imgUrl) {
  const title = decodeURIComponent(titleEnc);
  const desc = decodeURIComponent(descEnc);
    event.stopPropagation();
    const btn = event.currentTarget;
    const originalHtml = btn.innerHTML;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;border-top-color:#111;"></div>';
    
    try {
      const res = await fetch(`${API_BASE_URL}/api/item`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ storeUuid, sectionUuid, subsectionUuid, menuItemUuid })
      });
      const json = await res.json();
      btn.innerHTML = originalHtml;

      if (json.status === 'success' && json.data) {
        const cust = json.data.customizationsList || [];
        if (cust.length > 0) {
          // 有選項 -> 打開 modal
          openItemModal(storeUuid, sectionUuid, subsectionUuid, menuItemUuid, title, desc, basePrice, imgUrl);
        } else {
          // 無選項 -> 直接加入購物車
          window.noOptionsItems.add(menuItemUuid);
          cart.push({
            title: title,
            price: basePrice,
            qty: 1,
            note: '',
            options: [],
            storeName: currentStoreName,
            storeUrl: typeof currentStoreUrl !== 'undefined' ? currentStoreUrl : '',
            menuItemUuid: menuItemUuid
          });
          updateCartBadge();
          updateMenuActions();
        }
      }
    } catch (e) {
      btn.innerHTML = originalHtml;
      alert("網路錯誤");
    }
  }

  function handleQuickPlus(event, uuid) {
    event.stopPropagation();
    // 找到購物車中該品項並數量 + 1
    for (let i = 0; i < cart.length; i++) {
      if (cart[i].menuItemUuid === uuid) {
        cart[i].qty += 1;
        break;
      }
    }
    updateCartBadge();
    updateMenuActions();
  }

  function handleQuickTrash(event, uuid) {
    event.stopPropagation();
    // 數量 - 1，如果為 0 則移除
    for (let i = 0; i < cart.length; i++) {
      if (cart[i].menuItemUuid === uuid) {
        cart[i].qty -= 1;
        if (cart[i].qty <= 0) {
          cart.splice(i, 1);
        }
        break;
      }
    }
    updateCartBadge();
    updateMenuActions();
  }

    const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
    const btn = document.getElementById('floatingCartBtn');

      btn.innerText = `🛒 檢視購物車(${totalQty})`;
      btn.style.display = (totalQty > 0) ? 'block' : 'none';
    }
    const headerBadge = document.getElementById('headerCartBadge');
    if (headerBadge) {
      headerBadge.innerText = totalQty;
      headerBadge.style.display = totalQty > 0 ? 'inline-block' : 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateCartBadge();
    const initPhone = document.getElementById('initPhone');
    if (initPhone) {
        initPhone.value = localStorage.getItem('userPhone') || '';
    }
});

  let currentStoreUuid = '';

  let currentStoreDeliveryFee = '';

  let currentQty = 1;

function renderGroups(groups, pathPrefix) {
    let html = '';
    groups.forEach((group, gIdx) => {
        const gTitle = filterTrailingEnglish(parseText(group.title));
        const isRadio = group.maxPermitted === 1;
        let reqText = group.minPermitted > 0 ? `必填 ${group.minPermitted} 項` : '';
        if (group.maxPermitted > 1) reqText += ` (最多 ${group.maxPermitted} 項)`;
        
        const gPath = `${pathPrefix}_g${gIdx}`;
        
        html += `
        <div id="${gPath}" class="modal-section cust-group" data-min="${group.minPermitted || 0}" data-max="${group.maxPermitted || 0}" data-title="${escapeHTML(gTitle)}" style="background:#f9f9f9; padding:12px; border-radius:8px; border:1px solid #eee; margin-bottom:10px; transition: border 0.3s;">
            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">
                <h4 style="margin:0;">${escapeHTML(gTitle)}</h4>
                <span class="req-badge" style="font-size:12px; color:#666; background:#e0e0e0; padding:2px 6px; border-radius:4px; transition: all 0.3s;">${reqText}</span>
            </div>
        `;
        
        group.options.forEach((opt, oIdx) => {
            const oTitle = filterTrailingEnglish(parseText(opt.title));
            const oPrice = opt.price > 0 ? `+$${opt.price / 100}` : '';
            const oPath = `${gPath}_o${oIdx}`;
            
            let inputHtml = '';
            if (isRadio) {
                inputHtml = `<input type="radio" class="cust-input cust-radio" name="${gPath}" data-path="${oPath}" data-title="${escapeHTML(oTitle)}" data-price="${(opt.price || 0) / 100}" onchange="recalcCustomizations()" style="width:18px;height:18px;">`;
            } else {
                const optMax = opt.maxPermitted || 0;
                inputHtml = `
                <div class="cust-stepper" style="display:flex; align-items:center; gap:8px;">
                    <button type="button" onclick="changeCustQty(event, '${oPath}', -1, ${optMax})" style="width:28px;height:28px;border-radius:14px;border:1px solid #ccc;background:#fff;font-weight:bold;cursor:pointer;color:#111;display:flex;align-items:center;justify-content:center;">-</button>
                    <span id="qty_${oPath}" class="cust-qty cust-input" data-path="${oPath}" data-qty="0" data-title="${escapeHTML(oTitle)}" data-price="${(opt.price || 0) / 100}" style="font-size:15px;font-weight:bold;min-width:16px;text-align:center;">0</span>
                    <button type="button" onclick="changeCustQty(event, '${oPath}', 1, ${optMax})" style="width:28px;height:28px;border-radius:14px;border:1px solid #ccc;background:#fff;font-weight:bold;cursor:pointer;color:#111;display:flex;align-items:center;justify-content:center;">+</button>
                </div>
                `;
            }
            
            const hasChildren = opt.childCustomizationList && opt.childCustomizationList.length > 0;
            
            html += `
            <div class="cust-option-row">
                <label style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eaeaea; cursor:pointer;" onclick="${!isRadio ? 'event.preventDefault();' : ''}">
                    <div style="display:flex; align-items:center; gap:10px;">
                        ${inputHtml}
                        <span style="line-height:1.4;">${escapeHTML(oTitle)}</span>
                    </div>
                    <span style="color:#666; font-size:14px;">${oPrice}</span>
                </label>
            `;
            
            if (hasChildren) {
                html += `
                <div id="children_${oPath}" style="display:none; padding-left:15px; margin-top:5px; border-left:2px solid #ccc; margin-bottom:5px;">
                    ${renderGroups(opt.childCustomizationList, oPath)}
                </div>
                `;
            }
            
            html += `</div>`;
        });
        
        html += `</div>`;
    });
    return html;
}

function changeCustQty(event, oPath, delta, optMax) {
    if (event) {
        event.stopPropagation();
        event.preventDefault();
    }
    const qtySpan = document.getElementById(`qty_${oPath}`);
    if (!qtySpan) return;
    
    let current = parseInt(qtySpan.getAttribute('data-qty') || '0', 10);
    
    if (delta > 0) {
        if (optMax > 0 && current >= optMax) return;
        
        const groupDiv = qtySpan.closest('.cust-group');
        const groupMax = parseInt(groupDiv.getAttribute('data-max') || '0', 10);
        
        if (groupMax > 0) {
            let sum = 0;
            groupDiv.querySelectorAll(':scope > .cust-option-row > label > div > .cust-stepper > .cust-qty').forEach(span => {
                sum += parseInt(span.getAttribute('data-qty') || '0', 10);
            });
            if (sum >= groupMax) return;
        }
    }
    
    let newVal = current + delta;
    if (newVal < 0) newVal = 0;
    
    qtySpan.setAttribute('data-qty', newVal);
    qtySpan.innerText = newVal;
    
    recalcCustomizations();
}

function recalcCustomizations() {
    let extraPrice = 0;
    currentItem.selectedOptions = [];
    
    document.querySelectorAll('.cust-option-row').forEach(row => {
        const radio = row.querySelector(':scope > label .cust-radio');
        const qtySpan = row.querySelector(':scope > label .cust-stepper .cust-qty');
        const childrenDiv = row.querySelector(`:scope > div[id^="children_"]`);
        
        let isSelected = false;
        if (radio && radio.checked) isSelected = true;
        if (qtySpan && parseInt(qtySpan.getAttribute('data-qty') || '0', 10) > 0) isSelected = true;
        
        if (childrenDiv) {
            childrenDiv.style.display = isSelected ? 'block' : 'none';
        }
    });

    const getVisibleSelections = (container) => {
        container.querySelectorAll(':scope > .cust-group > .cust-option-row').forEach(row => {
            const radio = row.querySelector(':scope > label .cust-radio');
            const qtySpan = row.querySelector(':scope > label .cust-stepper .cust-qty');
            
            let qty = 0;
            if (radio && radio.checked) qty = 1;
            if (qtySpan) qty = parseInt(qtySpan.getAttribute('data-qty') || '0', 10);
            
            if (qty > 0) {
                const price = parseFloat(radio ? radio.getAttribute('data-price') : qtySpan.getAttribute('data-price')) || 0;
                const title = radio ? radio.getAttribute('data-title') : qtySpan.getAttribute('data-title');
                
                extraPrice += (price * qty);
if (qty > 1) {
currentItem.selectedOptions.push(`${title} x${qty}`);
} else {
currentItem.selectedOptions.push(title);
}
                
                const childrenDiv = row.querySelector(':scope > div[id^="children_"]');
                if (childrenDiv && childrenDiv.style.display !== 'none') {
                    getVisibleSelections(childrenDiv);
                }
            }
        });
    };
    
    const rootArea = document.getElementById('customizationsArea');
    if (rootArea) getVisibleSelections(rootArea);
    
    currentItem.totalPrice = currentItem.basePrice + extraPrice;
    updateModalPrice();
}

  function quickSetSchedule(startTimeSeconds, storeUuid) {
    document.getElementById('errorModalOverlay').style.display='none';
    
    // Switch to SCHEDULE mode
    setScheduleMode('SCHEDULE'); 
    const targetDate = new Date(startTimeSeconds * 1000);
    
    // Update selectedDateIndex
    const today = new Date();
    today.setHours(0,0,0,0);
    const targetDay = new Date(targetDate);
    targetDay.setHours(0,0,0,0);
    const diffDays = Math.round((targetDay - today) / (1000 * 60 * 60 * 24));
    
    if (diffDays >= 0 && diffDays < 7) {
        selectDate(diffDays); 
    }
    
    const timeSelect = document.getElementById('scheduleTime');
    let found = false;
    for (let i = 0; i < timeSelect.options.length; i++) {
        const optDate = new Date(timeSelect.options[i].value);
        if (Math.abs(optDate.getTime() - targetDate.getTime()) < 60000) {
            timeSelect.selectedIndex = i;
            found = true;
            break;
        }
    }
    
    if (!found) {
        const opt = document.createElement('option');
        const tzo = -targetDate.getTimezoneOffset() / 60;
        const sign = tzo >= 0 ? '+' : '-';
        const pad = n => String(Math.floor(Math.abs(n))).padStart(2, '0');
        const isoLocal = targetDate.getFullYear() + '-' + pad(targetDate.getMonth()+1) + '-' + pad(targetDate.getDate()) + 'T' + pad(targetDate.getHours()) + ':' + pad(targetDate.getMinutes()) + ':00' + sign + pad(tzo) + ':00';
        opt.value = isoLocal;
        const ampm = targetDate.getHours() >= 12 ? '下午' : '上午';
        const h12 = targetDate.getHours() % 12 || 12;
        const mm = String(targetDate.getMinutes()).padStart(2, '0');
        const isToday = targetDate.getDate() === new Date().getDate() && targetDate.getMonth() === new Date().getMonth();
        const datePrefix = isToday ? '' : `(${targetDate.getMonth()+1}/${targetDate.getDate()}) `;
        opt.text = `自訂: ${datePrefix}${getTimeEmoji(targetDate.getHours())} ${ampm} ${h12}:${mm}`;
        timeSelect.appendChild(opt);
        timeSelect.selectedIndex = timeSelect.options.length - 1;
    }
    
    // Re-attempt opening store
    openStore(storeUuid);
  }

  function getTimeEmoji(hour) {
    if (hour >= 6 && hour < 12) return '🌅'; // 06:00 ~ 11:59
    if (hour >= 12 && hour < 17) return '☀️'; // 12:00 ~ 16:59
    if (hour >= 17 && hour < 23) return '🌙'; // 17:00 ~ 22:59
    return '💤'; // 23:00 ~ 05:59
}
function escapeHTML(str) {
    return String(str).replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  function syncPhone(source) {
    const init = document.getElementById('initPhone');
    const chk = document.getElementById('checkoutPhone');
    
    if (source === 'init' && init) {
        localStorage.setItem('userPhone', init.value);

    }

  function calcOrderCost(items) {
  let totalSum = 0;
  items.forEach(it => totalSum += it.price * it.qty);
  
  let promoDiscount = totalSum >= 285 ? 143 : Math.floor(totalSum / 2);
  let preOrderDiscount = 0;
  if (typeof scheduleMode !== 'undefined' && scheduleMode !== 'ASAP') {
    const ts = document.getElementById('scheduleTime');
    if (ts && ts.value) {
      if (new Date(ts.value).getTime() - new Date().getTime() >= 2.5 * 3600000) {
        preOrderDiscount = 10;
      }
    }
  }
  
  let noBinCost = (totalSum - promoDiscount) + 50 - preOrderDiscount;

  let expanded = [];
  items.forEach(it => {
    for (let j = 0; j < it.qty; j++) {
      expanded.push({ name: it.title, price: it.price, storeName: it.storeName || '未命名餐廳', note: it.note || '' });
    }
  });

  if (expanded.length <= 1) return { shouldSplit: false, noBinCost, bestCost: noBinCost, bins: null, savings: 0 };

  expanded.sort((a, b) => b.price - a.price);

  let bestBins = null;
  let bestCost = Infinity;

  for (let attempt = 0; attempt < 1000; attempt++) {
    let bins = [];
    let cur = [...expanded];
    if (attempt > 0) {
      for (let i = cur.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cur[i], cur[j]] = [cur[j], cur[i]];
      }
    }

    for (let item of cur) {
      let placed = false;
      for (let bin of bins) {
        if (bin.sum + item.price <= 285) {
          bin.items.push(item);
          bin.sum += item.price;
          placed = true;
          break;
        }
      }
      if (!placed) {
        let maxGap = -1;
        let bestBin = null;
        for (let bin of bins) {
          if (bin.sum < 285 && (285 - bin.sum) > maxGap) {
            maxGap = 285 - bin.sum;
            bestBin = bin;
          }
        }
        if (bestBin && (bestBin.sum + item.price <= 285 || Math.random() < 0.3)) {
          bestBin.items.push(item);
          bestBin.sum += item.price;
        } else {
          bins.push({ items: [item], sum: item.price });
        }
      }
    }

    let cost = 0;
    let feePerBin = bins.length >= 2 ? 30 : 50;
    for (let bin of bins) {
      let binPromo = bin.sum >= 285 ? 143 : Math.floor(bin.sum / 2);
      let binFoodCost = bin.sum - binPromo;
      cost += binFoodCost + feePerBin;
    }
    cost -= preOrderDiscount;

    if (cost < bestCost) {
      bestCost = cost;
      bestBins = bins;
    }
  }

  return {
    shouldSplit: totalSum >= 350 && bestBins && bestBins.length > 1 && bestCost < noBinCost,
    noBinCost,
    bestCost,
    bins: bestBins,
    savings: noBinCost - bestCost
  };
}
function buildSplitSuggestionHtml(result) {
    if (!result.shouldSplit) return '';
    let html = `<div style="background:#f0fbf4; border:2px solid #06c167; border-radius:12px; padding:15px; margin-top:15px;">`;
    html += `<div style="font-weight:bold; color:#06c167; font-size:16px; text-align:center; margin-bottom:10px;">💡 拆單建議（拆成 ${result.bins.length} 單）</div>`;
    html += `<div style="text-align:center; margin-bottom:12px;">`;
    html += `<span style="text-decoration:line-through; color:#999;">不拆: $${result.noBinCost}</span>`;
    html += ` → <span style="color:#06c167; font-weight:bold;">拆單: $${result.bestCost}</span>`;
    html += ` <span style="color:#d32f2f; font-weight:bold;">省 $${result.savings}！</span>`;
    html += `</div>`;

    result.bins.forEach((bin, i) => {
      let counts = {};
      for (let item of bin.items) {
        let key = item.name;
        counts[key] = (counts[key] || 0) + 1;
      }
      let itemStrs = [];
      for (let key in counts) {
        itemStrs.push(counts[key] > 1 ? `${key} x${counts[key]}` : key);
      }
      html += `<div style="background:white; border:1px solid #eee; padding:10px; border-radius:8px; margin-bottom:6px;">`;
      html += `<div style="font-weight:bold; color:#333;">第 ${i+1} 單 <span style="color:#d32f2f;">$${bin.sum}</span></div>`;
      html += `<div style="font-size:13px; color:#666; margin-top:4px;">${itemStrs.join('、')}</div>`;
      html += `</div>`;
    });
    html += `</div>`;
    return html;
  }

  function buildSplitMsgText(result) {
    if (!result.shouldSplit || !result.bins) return '';
    let text = '\n\n💡 拆單建議（省 $' + result.savings + '）：';
    result.bins.forEach((bin, i) => {
      let counts = {};
      for (let item of bin.items) {
        let key = item.name;
        counts[key] = (counts[key] || 0) + 1;
      }
      let itemStrs = [];
      for (let key in counts) {
        itemStrs.push(counts[key] > 1 ? `${key} x${counts[key]}` : key);
      }
      text += `\n第 ${i+1} 單 $${bin.sum}：${itemStrs.join('、')}`;
    });
    return text;
  }

    document.getElementById('errorModalOverlay').style.display = 'flex';
  }

  window.setupScrollSpy = function() {
      const cats = document.querySelectorAll('.menu-category[id^="cat_"]');
      const navs = document.querySelectorAll('.store-sidebar-item');
      if (cats.length === 0) return;
      const onScroll = () => {
          if (currentView !== 'store') {
              window.removeEventListener('scroll', onScroll);
              return;
          }
          let currentId = '';
          cats.forEach(cat => {
              const rect = cat.getBoundingClientRect();
              if (rect.top <= 130) {
                  currentId = cat.id;
              }
          });
          if (!currentId && cats.length > 0) currentId = cats[0].id;
          navs.forEach(nav => {
              nav.classList.remove('active');
              if (nav.id === `nav_${currentId}`) {
                  nav.classList.add('active');
                  const sb = document.querySelector('.store-sidebar');
                  if (sb) {
                      const navRect = nav.getBoundingClientRect();
                      const sbRect = sb.getBoundingClientRect();
                      if (navRect.bottom > sbRect.bottom) sb.scrollTop += navRect.bottom - sbRect.bottom;
                      if (navRect.top < sbRect.top) sb.scrollTop -= sbRect.top - navRect.top;
                  }
              }
          });
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      setTimeout(onScroll, 100);
  };
</script>
