<script>

  
  function getSelectedScheduleTimestamp() {
      const ts = document.getElementById('scheduleTime');
      if (!ts || !ts.value) return 0;
      try {
          const parsed = JSON.parse(ts.value);
          const baseDate = new Date(parsed.date + "T00:00:00+08:00");
          return baseDate.getTime() + (parsed.startTime * 60 * 1000);
      } catch (e) {
          const d = new Date(ts.value);
          return isNaN(d) ? 0 : d.getTime();
      }
  }

  let API_BASE_URL = '';

  let WS_URL = '';

  

  // 動態取得預設的連線位置

  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';

  const host = window.location.hostname || '127.0.0.1';

  WS_URL = `${protocol}//${host}:8000/ws`;

const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

const isDesktopDevice = !isMobileDevice;



function copyToClipboardFallback(text, btn) {

    if (navigator.clipboard && window.isSecureContext) {

        navigator.clipboard.writeText(text);

    } else {

        const ta = document.createElement("textarea");

        ta.value = text;

        ta.style.position = "fixed";

        document.body.appendChild(ta);

        ta.select();

        try { document.execCommand("copy"); } catch(e){}

        document.body.removeChild(ta);

    }

    if (btn) {

        btn.innerText = '已複製！請貼上至官方帳號';

        btn.style.background = '#06c167';

        btn.style.color = '#fff';

    }

}

function renderModalTimes() {
    const dateStr = document.getElementById('modalDateSelect').value;
    const timeSelect = document.getElementById('modalTimeSelect');
    timeSelect.innerHTML = '';
    
    if (!uberTimeData || !uberTimeData.timeRanges || !uberTimeData.timeRanges[dateStr]) return;
    
    const ranges = uberTimeData.timeRanges[dateStr];
    ranges.forEach(w => {
        const st = w.startTime || 0;
        const et = w.endTime || 0;
        
        const h = Math.floor(st / 60);
        const m = st % 60;
        const endH = Math.floor(et / 60);
        const endM = et % 60;
        
        const startAmpm = h >= 12 ? '下午' : '上午';
        const endAmpm = endH >= 12 ? '下午' : '上午';
        const startH12 = h % 12 || 12;
        const endH12 = endH % 12 || 12;
        const startMM = m.toString().padStart(2, '0');
        const endMM = endM.toString().padStart(2, '0');
        
        let displayTitle = '';
        if (startAmpm === endAmpm) {
            displayTitle = `${getTimeEmoji(h)} ${startAmpm} ${startH12}:${startMM} - ${endH12}:${endMM}`;
        } else {
            displayTitle = `${getTimeEmoji(h)} ${startAmpm} ${startH12}:${startMM} - ${getTimeEmoji(endH)} ${endAmpm} ${endH12}:${endMM}`;
        }
        
        const opt = document.createElement('option');
        opt.value = JSON.stringify({ date: dateStr, startTime: st, endTime: et, title: displayTitle });
        opt.text = displayTitle;
        timeSelect.appendChild(opt);
    });
}

  async function searchAddress(force = false) {

    let q = document.getElementById('addrInput').value.trim();

    if (!force && q === window.lastSearchedAddr) return;

    window.lastSearchedAddr = q;



    if (q.startsWith('📍 ')) q = q.substring(3).trim();

    if (!q) { updateAddrTitleState('default'); return; }









    

    // Check if it's already in history to skip server searching
    // [修補] 超過 7 天的歷史地址視為過時，強制重新查詢座標
    const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

    const matchedHistory = addressHistory.find(item => item.title === q);

    if (matchedHistory && matchedHistory.savedAt && (Date.now() - matchedHistory.savedAt) < SEVEN_DAYS_MS) {

      setAddress(matchedHistory.lat, matchedHistory.lng, matchedHistory.title);

      return;

    }

    

    const statusEl = document.getElementById('addrStatus');

    const resultsEl = document.getElementById('addrResults');

    statusEl.innerText = ''; 

    resultsEl.innerHTML = '';



    const fallbackSearch = async () => {

    try {

        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=tw&q=${encodeURIComponent(q)}&accept-language=zh-TW&addressdetails=1`);

        const data = await res.json();

        if (data.length === 0) {

            statusEl.innerText = '找不到地址';
            if (document.getElementById('fullScreenLoader')) document.getElementById('fullScreenLoader').style.display = 'none';

            return;

        }

        if (data.length === 1) {

            setAddress(data[0].lat, data[0].lon, formatNominatimAddress(data[0]));

        } else {

            if (document.getElementById('fullScreenLoader')) document.getElementById('fullScreenLoader').style.display = 'none';
            statusEl.innerText = '請選擇精確地址：';

            resultsEl.innerHTML = data.slice(0, 5).map(item => {

                const formatted = formatNominatimAddress(item);

                return `<div class="addr-item" onclick="setAddress(${item.lat}, ${item.lon}, '${escapeHTML(formatted)}')">

                    ${escapeHTML(formatted)}

                </div>`;

            }).join('');

        }

    } catch (e) {

        statusEl.innerText = '搜尋地址錯誤: ' + e.message;

        updateAddrTitleState('error');
        if (document.getElementById('fullScreenLoader')) document.getElementById('fullScreenLoader').style.display = 'none';

        if (document.getElementById('fullScreenLoader')) document.getElementById('fullScreenLoader').style.display = 'none';

    }

    if (btn2) { btn2.disabled = false; btn2.style.opacity = '1'; btn2.style.cursor = 'pointer'; }

    };

    // 前端防呆：如果字串是以「路、街、巷、弄、段」結尾，代表 100% 沒有門牌號碼

    if (/[\u8def\u8857\u5df7\u5f04\u6bb5]$/.test(q)) {

        document.getElementById('addrStatus').innerText = '請輸入包含「門牌號碼」的完整地址，不能僅輸入到路名';

        updateAddrTitleState('error');
        if (document.getElementById('fullScreenLoader')) document.getElementById('fullScreenLoader').style.display = 'none';

        document.getElementById('addrResults').innerHTML = '';

        const btn = document.getElementById('searchAddrBtn');

        const btn2 = document.getElementById('searchStoresBtn');

        btn.disabled = false;

        if (btn2) { btn2.disabled = false; btn2.style.opacity = '1'; btn2.style.cursor = 'pointer'; }

        return;

    }



    

    try {

      // 先使用 Nominatim 進行「模糊地址」過濾（防止只輸入台北市、南屯區）

      try {

          const nomRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=tw&q=${encodeURIComponent(q)}&accept-language=zh-TW&addressdetails=1`);

          const nomData = await nomRes.json();

          if (nomData.length > 0) {

              const bestMatch = nomData[0];

              if (bestMatch.class === 'boundary' || bestMatch.type === 'administrative' || bestMatch.class === 'highway') {

                  document.getElementById('addrStatus').innerText = '請輸入包含「門牌號碼」的完整地址 (例: 臺北市中正區重慶南路一段122號) 或具體地標 (例: 台北車站)';

                  updateAddrTitleState('error');
        if (document.getElementById('fullScreenLoader')) document.getElementById('fullScreenLoader').style.display = 'none';

                  document.getElementById('addrResults').innerHTML = '';

                  const btn = document.getElementById('searchAddrBtn');

                  const btn2 = document.getElementById('searchStoresBtn');

                  btn.disabled = false;

                  if (btn2) { btn2.disabled = false; btn2.style.opacity = '1'; btn2.style.cursor = 'pointer'; }

                  return;

              }

          }

      } catch(e) {} // 如果 Nominatim 掛掉，就直接放行給 Google WS

      

      const ws = new WebSocket(WS_URL);

      let resolved = false;

      

      const timeoutId = setTimeout(() => {

        if (!resolved) {

          resolved = true;

          ws.close();

          fallbackSearch();

        }

      }, 15000);



      ws.onerror = () => {

        if (!resolved) {

          resolved = true;

          clearTimeout(timeoutId);

          ws.close();

          fallbackSearch();

        }

      };

      ws.onclose = () => {

        if (!resolved) {

          resolved = true;

          clearTimeout(timeoutId);

          fallbackSearch();

        }

      };

      ws.onopen = () => {

        console.log('Sending search request to server WS:', WS_URL);

        ws.send(JSON.stringify({ type: 'search_address', address: q }));

      };



      ws.onmessage = (event) => {

        if (resolved) return;

        const data = JSON.parse(event.data);

        if (data.type === 'search_address_result') {

          resolved = true;

          clearTimeout(timeoutId);

          ws.close();

          if (data.success && data.lat && data.lng) {

            setAddress(data.lat, data.lng, q);

          } else {

            fallbackSearch();

          }

        }

      };



      // [修補] 移除重複的 ws.onerror（已在上方定義過）

    } catch (e) { 

        fallbackSearch();

    }

  }



  async function setAddress(lat, lng, title) {

    const statusEl = document.getElementById('addrStatus');

    statusEl.innerText = ''; 

    document.getElementById('addrResults').innerHTML = '';

    let displayTitle = title.split(',')[0];

    if (displayTitle.startsWith('📍 ')) displayTitle = displayTitle.substring(3).trim();

    document.getElementById('addrInput').value = displayTitle;

    scrollAddrToEnd();

    // [修補] 先暫存舊座標，等 API 確認成功後才真正更新
    const prevLat = currentLat;
    const prevLng = currentLng;
    const prevTitle = currentAddrTitle;

    currentLat = lat;

    currentLng = lng;

    currentAddrTitle = displayTitle;

    try {

      const res = await fetch(`${API_BASE_URL}/api/set-address`, {

        method: 'POST', headers: { 'Content-Type': 'application/json' },

        body: JSON.stringify({ lat, lng, title })

      });

      let json;

      try {

          const textRes = await res.text();

          try {

              json = JSON.parse(textRes);

          } catch (e) {

              console.error('Non-JSON response from server:', textRes);

              throw new Error('伺服器回傳了非 JSON 格式的錯誤: ' + textRes.substring(0, 50) + '...');

          }

      } catch (e) {

          throw e;

      }

      if (json.status === 'success') {

      const expectedUberPayload = {

      const uberSearchHeaders = {

      };
      
      const uberSearchPayload = {

      } catch (e) {

      if (!res.ok || json.status === 'failure') { statusEl.innerHTML = '搜尋失敗'; return; }

      

      let stores = [];

      (json.data.feedItems || []).forEach(item => {

          if ((item.type === 'REGULAR_STORE' || item.type === 'REGULAR_STORE_WITH_ITEMS') && item.store) {

              stores.push(item.store);

          } else if ((item.type === 'REGULAR_CAROUSEL' || item.type === 'STORE_CAROUSEL') && item.carousel && item.carousel.stores) {

              stores.push(...item.carousel.stores);

          } else if (item.type === 'MINI_STORE_WITH_ITEMS' && item.miniStoreWithItems && item.miniStoreWithItems.store) {

              stores.push(item.miniStoreWithItems.store);

          }

      });

      // 過濾掉重複的 storeUuid (有時推薦輪播跟一般列表會重複)

      const seen = new Set();

      stores = stores.filter(s => {

          if (seen.has(s.storeUuid)) return false;

          seen.add(s.storeUuid);

          return true;

      });

      

      // 根據使用者要求進行極致智能排序：分類、抽首位、穿插

      const searchQ = q.toLowerCase();

      const isShort = searchQ.length < 4;



      let topMatched = null;

      let openStores = [];

      let closedMatchedStores = [];

      let closedUnmatchedStores = [];



      stores.forEach(s => {

          const name = s.title && s.title.text ? s.title.text.toLowerCase() : '';

          const state = s.storeAvailablityState || '';

          let isUIClosed = false;

          if (state.includes('CLOSED')) isUIClosed = true;

          if (s.tracking && s.tracking.storePayload && s.tracking.storePayload.storeAvailablityState && s.tracking.storePayload.storeAvailablityState.includes('CLOSED')) isUIClosed = true;

          if (s.imageOverlay && s.imageOverlay.text === 'Closed') isUIClosed = true;

          const isCompletelyClosed = isUIClosed || state === 'STORE_OFFLINE' || state === 'STORE_UNAVAILABLE';

          const isStrongMatch = searchQ && (name.startsWith(searchQ) || name === searchQ);

          const isWeakMatch = searchQ && name.includes(searchQ) && !isStrongMatch;



          // 標記這家店的匹配分數，方便等一下在各自陣列中再排序一次

          s._matchScore = isStrongMatch ? 2 : (isWeakMatch ? 1 : 0);



          if (!isCompletelyClosed) {

              openStores.push(s);

          } else if (isStrongMatch || isWeakMatch) {

              closedMatchedStores.push(s);

          } else {

              closedUnmatchedStores.push(s);

          }

      });



      // 各自內部排序：讓符合名稱的排在前面

      const sortByMatch = (a, b) => b._matchScore - a._matchScore;

      openStores.sort(sortByMatch);

      closedMatchedStores.sort(sortByMatch);



      let finalList = [];



      if (isShort) {

          // 如果字數少於 4，抽取「第一家完全符合」的店家，不論有沒有開，放在絕對第一名

          // 優先從有開的找，找不到再從沒開的找

          let foundIdx = openStores.findIndex(s => s._matchScore > 0);

          if (foundIdx !== -1) {

              topMatched = openStores.splice(foundIdx, 1)[0];

          } else {

              foundIdx = closedMatchedStores.findIndex(s => s._matchScore > 0);

              if (foundIdx !== -1) {

                  topMatched = closedMatchedStores.splice(foundIdx, 1)[0];

              }

          }



          if (topMatched) finalList.push(topMatched);



          // 接下來把剩下的「有開的」與「沒開但符合的」穿插 (每 2 家有開的，穿插 1 家沒開的)

          let openIdx = 0, closedIdx = 0;

          while (openIdx < openStores.length || closedIdx < closedMatchedStores.length) {

              if (openIdx < openStores.length) finalList.push(openStores[openIdx++]);

              if (openIdx < openStores.length) finalList.push(openStores[openIdx++]);

              if (closedIdx < closedMatchedStores.length) finalList.push(closedMatchedStores[closedIdx++]);

          }

      } else {

          // 如果字數 >= 4 (通常是確切店名)，把所有強烈符合的(不管有沒有開)都放在最前面

          const strongClosed = closedMatchedStores.filter(s => s._matchScore === 2);

          const weakClosed = closedMatchedStores.filter(s => s._matchScore < 2);

          

          finalList = finalList.concat(openStores.filter(s => s._matchScore === 2)); // 強符合 有開

          finalList = finalList.concat(strongClosed);                                // 強符合 沒開

          finalList = finalList.concat(openStores.filter(s => s._matchScore < 2));   // 弱/不符合 有開

          finalList = finalList.concat(weakClosed);                                  // 弱符合 沒開

      }



      // 最後補上完全沒中且沒開的幽靈店家

      finalList = finalList.concat(closedUnmatchedStores);

      stores = finalList;

            }

            imgUrl = getUberWebpUrl(bestItem.url);

        }

        const rating = s.rating ? s.rating.text : '無評價';

                let name = s.title ? s.title.text : '未知餐廳';
        if (typeof currentVertical !== 'undefined' && currentVertical === 'SHOP') {

        let isClosed = false;

        if (s.tracking && s.tracking.storePayload && s.tracking.storePayload.storeAvailablityState === 'STORE_CLOSED') {

            isClosed = true;

        } else if (s.imageOverlay && s.imageOverlay.text === 'Closed') {

            isClosed = true;

        }



        const isBad = unSchedulableStores.includes(s.storeUuid);

        

        // 加上 grayscale 讓圖片反灰

        const style = (isBad || isClosed) ? 'filter: grayscale(100%); opacity: 0.85;' : '';

        

        let overlayHtml = '';

        if (isClosed && !isBad) {

            overlayHtml = `<div style="position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:bold; letter-spacing:1px; z-index:2;">休息中可預約</div>`;

        } else if (isBad) {

            overlayHtml = `<div style="position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:bold; letter-spacing:1px; z-index:2;">無法接單</div>`;

        // 解析 meta 標籤中的預約資訊

                    } else {
                        metaText = openEta.text ? openEta.text.replace('min', '分鐘') : '';
                    }
                } else if (openEta.text) {
                    metaText = openEta.text.replace('min', '分鐘');
                }
            }

        }

        

        let etaBadgeHtml = '';
        if (metaText && !isClosed && !isBad) {
            etaBadgeHtml = `<div style="position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.7); color:#fff; padding:4px 8px; border-radius:20px; font-size:12px; font-weight:bold; letter-spacing:0.5px; z-index:3; display:flex; align-items:center; gap:4px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-top:-1px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>${escapeHTML(metaText.replace('預計 ', ''))}</div>`;

function handleStoreSearch(isUserInput = false) {

  const keyword = document.getElementById('storeSearchInput').value.trim().toLowerCase();

  

  if (currentView === 'list') {

      const cards = document.querySelectorAll('#results .card');

      cards.forEach(card => {

          const name = card.querySelector('.card-name') ? card.querySelector('.card-name').innerText.toLowerCase() : '';

          if (name.includes(keyword)) {

              card.style.display = '';

          } else {

              card.style.display = 'none';

          }

      });

      

      if (isUserInput) {

          clearTimeout(window.listSearchDebounceTimer);

          window.listSearchDebounceTimer = setTimeout(() => {

              triggerListSearch(false);

          }, 1200);

      }

      return;

  }

  

  const results = document.getElementById('storeSearchResults');

  

  if (!keyword) {

    results.innerHTML = '';

    return;

  }

  

  if (!window.currentStoreRawData) return;

  const d = window.currentStoreRawData;

  const storeUuid = d.uuid;

  

  let html = '<div class="menu-grid">';

  let found = 0;

  

  if (d.catalogSectionsMap) {

    Object.keys(d.catalogSectionsMap).forEach(key => {

      const sectionArr = d.catalogSectionsMap[key];

      sectionArr.forEach(section => {

        const secUuid = key;

        const subsecUuid = section.catalogSectionUUID || '';

        if (section.payload && section.payload.standardItemsPayload) {

          const items = section.payload.standardItemsPayload.catalogItems || [];

          items.forEach(item => {

            const itemTitle = (typeof filterTrailingEnglish === 'function') ? filterTrailingEnglish(parseText(item.title)) : parseText(item.title) || '';

            const itemDesc = (typeof filterTrailingEnglish === 'function') ? filterTrailingEnglish(parseText(item.itemDescription)) : parseText(item.itemDescription) || '';

            

            if (itemTitle.toLowerCase().includes(keyword) || itemDesc.toLowerCase().includes(keyword)) {

                const priceVal = item.price > 0 ? Math.round(item.price / 100) : 0;

                let priceHtml = priceVal > 0 ? '$' + priceVal : '';

                if (item.priceTagline && item.priceTagline.textFormat) {

                  priceHtml = item.priceTagline.textFormat;

                }

                if (item.isSoldOut) priceHtml = '<span style="color:#d32f2f;">已售完</span>';

                

                const imgUrl = getUberWebpUrl(item.imageUrl || '');

                

                let isPromo = false;

                try {

                  if (item.promoInfo && item.promoInfo.promoBadge && item.promoInfo.promoBadge.content && item.promoInfo.promoBadge.content.richText) {

                    const elements = item.promoInfo.promoBadge.content.richText.richTextElements;

                    if (elements && elements.length > 0 && elements[0].text && elements[0].text.text && elements[0].text.text.text) {

                      const txt = elements[0].text.text.text;

                      if (txt.includes('買 1 送 1') || txt.includes('免費商品')) {

                         isPromo = true;

                      }

                if (!isPromo) {

                  let itemHtml = '<div class="menu-item" style="position: relative;' + (isSoldOut ? ' opacity:0.6; cursor:not-allowed;' : '') + '" ' + (isSoldOut ? '' : 'onclick="toggleStoreSearch(); openItemModal(\'' + storeUuid + '\', \'' + secUuid + '\', \'' + subsecUuid + '\', \'' + item.uuid + '\', \'' + encodeURIComponent(itemTitle).replace(/'/g, "%27") + '\', \'' + encodeURIComponent(itemDesc).replace(/'/g, "%27") + '\', ' + priceVal + ', \'' + imgUrl + '\', ' + (item.hasCustomizations === false ? 'false' : 'true') + ')"') + '>';

                  itemHtml += '<div class="menu-item-info">';

                  itemHtml += '<div class="menu-item-title">' + escapeHTML(itemTitle) + '</div>';

                  itemHtml += '<div class="menu-item-desc">' + escapeHTML(itemDesc) + '</div>';

                  itemHtml += '<div class="menu-item-price">' + priceHtml + '</div>';

                  itemHtml += '</div>';

                  

                  if (imgUrl) {

                    itemHtml += '<div class="menu-item-img" style="background-image: url(\'' + imgUrl + '\')"></div>';

                  }

                  

                  if (!isSoldOut) {
                      itemHtml += '<div class="item-action-area" id="action-' + item.uuid + '" style="position: absolute; right: 15px; bottom: 15px; background: white; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; overflow: hidden;" onclick="event.stopPropagation();">';
                      itemHtml += '<div class="quick-add-btn" onclick="handleQuickAdd(event, \'' + storeUuid + '\', \'' + secUuid + '\', \'' + subsecUuid + '\', \'' + item.uuid + '\', \'' + encodeURIComponent(itemTitle).replace(/'/g, "%27") + '\', \'' + encodeURIComponent(itemDesc).replace(/'/g, "%27") + '\', ' + priceVal + ', \'' + imgUrl + '\', ' + (item.hasCustomizations === false ? 'false' : 'true') + ')" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; color: #111;">＋</div>';
                      itemHtml += '</div>';
                  }
                  itemHtml += '</div>';

                  

                  html += itemHtml;

                }

            }

          });

        }

      });

    });

  }

  html += '</div>';

  if(found === 0) html = '<div style="text-align:center; padding:30px; color:#666;">找不到符合「' + escapeHTML(keyword) + '」的餐點</div>';

  results.innerHTML = html;

  updateMenuActions();

}

async function handleQuickAdd(event, storeUuid, sectionUuid, subsectionUuid, menuItemUuid, titleEnc, descEnc, basePrice, imgUrl, hasCustomizations) {
  if (!window._quickAddLocks) window._quickAddLocks = {};
  if (window._quickAddLocks[menuItemUuid]) return;
  window._quickAddLocks[menuItemUuid] = true;
  try {
    const title = decodeURIComponent(titleEnc);

  const desc = decodeURIComponent(descEnc);

    event.stopPropagation();

    const btn = event.currentTarget;

    const originalHtml = btn.innerHTML;

    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;border-top-color:#111;"></div>';

    

    try {

      if (window.isGroceryStore) {

          btn.innerHTML = originalHtml;

          openGroceryCheckoutSummary();

          return;

      }

      if (hasCustomizations === false) {

          btn.innerHTML = originalHtml;

          window.noOptionsItems.add(menuItemUuid);

          cart.push({

            title: title,

            price: basePrice,

            qty: 1,

            note: '',

            options: [],

            storeName: currentStoreName,

            storeUrl: typeof currentStoreUrl !== 'undefined' ? currentStoreUrl : '',

            menuItemUuid: menuItemUuid,

            storeDeliveryFee: typeof currentStoreDeliveryFee !== 'undefined' ? currentStoreDeliveryFee : 0,\n      originalStoreDeliveryFee: typeof currentOriginalDeliveryFee !== 'undefined' ? currentOriginalDeliveryFee : (typeof currentStoreDeliveryFee !== 'undefined' && currentStoreDeliveryFee > 0 ? currentStoreDeliveryFee + 50 : 0)

          });

          updateCartBadge();

          updateMenuActions();

          showToast(`已加入: ${title}`);

          return;

      }


        btn.innerHTML = originalHtml;
        openItemModal(storeUuid, sectionUuid, subsectionUuid, menuItemUuid, titleEnc, descEnc, basePrice, imgUrl, hasCustomizations);
    } catch (e) {

      btn.innerHTML = originalHtml;

      console.error('Quick add error:', e);

      showToast('載入失敗，請再試一次');

    }
  } finally {
      window._quickAddLocks[menuItemUuid] = false;
  }

  }



  function handleQuickPlus(event, uuid) {

    event.stopPropagation();

    // 找到購物車中該品項並數量 + 1

    for (let i = 0; i < cart.length; i++) {

      if (cart[i].menuItemUuid === uuid) {

        cart[i].qty += 1;

        break;

      }

    }

    updateCartBadge();

    updateMenuActions();

  }



  function handleQuickTrash(event, uuid) {

    event.stopPropagation();

    // 數量 - 1，如果為 0 則移除

    for (let i = 0; i < cart.length; i++) {

      if (cart[i].menuItemUuid === uuid) {

        cart[i].qty -= 1;

        if (cart[i].qty <= 0) {

          cart.splice(i, 1);

        }

        break;

      }

    }

    updateCartBadge();

    updateMenuActions();

  }



  function updateCartBadge() {

    const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);

    const btn = document.getElementById('floatingCartBtn');

    if (btn) {

      btn.innerText = `🛒 檢視購物車(${totalQty})`;

      btn.style.display = (totalQty > 0) ? 'block' : 'none';

    }

    const headerBadge = document.getElementById('headerCartBadge');

    if (headerBadge) {

      headerBadge.innerText = totalQty;

      headerBadge.style.display = totalQty > 0 ? 'inline-block' : 'none';

    }

  }



  document.addEventListener('DOMContentLoaded', () => {

    updateCartBadge();

    const initPhone = document.getElementById('initPhone');

    if (initPhone) {

        initPhone.value = localStorage.getItem('userPhone') || '';

    }

});



  let currentStoreUuid = '';

  let currentStoreName = '';

  let currentStoreUrl = '';

  let currentStoreDeliveryFee = '';\nlet currentOriginalDeliveryFee = 0;

  let currentItem = null;

  let currentQty = 1;

  let currentCustomizations = [];



  function viewCart() {

  if (cart.length === 0) {

    alert('購物車是空的');

    return;

  }

  

  let html = '';

  let total = 0;

  

  const storeGroups = {};

  cart.forEach(item => {

    const sName = item.storeName || '未命名餐廳';

    if (!storeGroups[sName]) storeGroups[sName] = [];

    storeGroups[sName].push(item);

  });



  Object.keys(storeGroups).forEach(sName => {

    html += `<div style="font-size:18px; font-weight:bold; margin-top:15px; margin-bottom:10px;">${escapeHTML(sName)}</div>`;

    

    storeGroups[sName].forEach((item) => {

      const idx = cart.indexOf(item);

      const lineTotal = item.price * item.qty;

      total += lineTotal;

      

      html += `

      <div style="border-bottom: 1px solid #eee; padding: 15px 0;">

        <div style="display:flex; justify-content:space-between; margin-bottom: 10px;">

          <div style="font-weight:bold; font-size:16px;">${escapeHTML(item.title)}</div>

          <div style="font-weight:bold; font-size:16px;">$${lineTotal}</div>

        </div>

        ${item.note ? `<div style="font-size:13px; color:#666; margin-bottom:10px;">${escapeHTML(item.note)}</div>` : ''}

        

        <div style="text-align: right;">

          <div style="background: #f5f5f5; border-radius: 30px; display:inline-flex; align-items:center; height:40px;">

            <div onclick="updateCartItemQty(${idx}, -1)" style="width: 40px; height: 100%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size: 16px; font-weight:bold; color: #111;">${item.qty === 1 ? '🗑️' : '－'}</div>

            <div style="width: 40px; text-align:center; font-size: 16px; font-weight:bold; color: #111;">${item.qty}</div>

            <div onclick="updateCartItemQty(${idx}, 1)" style="width: 40px; height: 100%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size: 18px; font-weight:bold; color: #111;">＋</div>

          </div>

        </div>

      </div>

      `;

    });

  });

  

  html += `<div style="margin-top: 20px; text-align:right; font-size:20px; font-weight:bold;">小計: $${total}</div>`;

  

  document.getElementById('cartContent').innerHTML = html;

  

  document.getElementById('homeView').style.display = 'none';

  document.getElementById('storeView').style.display = 'none';

  document.getElementById('listView').style.display = 'none';

  document.getElementById('checkoutView').style.display = 'none';

  document.getElementById('cartView').style.display = 'block';

  

  if (!originalAppHeaderHtml) originalAppHeaderHtml = document.querySelector('.app-header').innerHTML;

  document.querySelector('.app-header').innerHTML = `

    <button onclick="goBackToStore()" style="background:transparent; border:none; font-size:24px; font-weight:bold; cursor:pointer; padding:0; display:flex; align-items:center; gap:10px; color:#111;">← <span style="font-size:20px;">購物車</span></button>

    <button onclick="goBackToStore()" style="background:#f5f5f5; color:#111; border:none; padding:8px 12px; border-radius:8px; font-weight:bold; font-size:14px;">新增商品</button>

  `;

  document.querySelector('.app-header').style.display = 'flex';



  if (document.getElementById('floatingCartBtn')) document.getElementById('floatingCartBtn').style.display = 'none';

  window.scrollTo(0, 0);

}



function updateCartItemQty(idx, change) {

  cart[idx].qty += change;

  if (cart[idx].qty <= 0) {

    cart.splice(idx, 1);

  }

  updateCartBadge();

  if (typeof updateMenuActions === 'function') updateMenuActions();

  

  if (cart.length === 0) {

    goBackToStore();

    return;

  }

  viewCart();

}

            let timeText = '盡快送達';

            if (!binStores[it.storeName][key]) {

              binStores[it.storeName][key] = { title: it.name, note: it.note, price: it.price, qty: 0, storeUrl: it.storeUrl, storeDeliveryFee: it.storeDeliveryFee || 0 };

          });



          Object.keys(binStores).forEach(sName => {

      ]);

  } catch (err) {

      showModal('發生錯誤', err.message, true);

  }

}

function renderGroups(groups, pathPrefix) {

    let html = '';

    groups.forEach((group, gIdx) => {

        const isRadio = group.maxPermitted === 1;

        let reqText = group.minPermitted > 0 ? `必填 ${group.minPermitted} 項` : '';

        if (group.maxPermitted > 1) reqText += ` (最多 ${group.maxPermitted} 項)`;

        

        const gPath = `${pathPrefix}_g${gIdx}`;

        

        html += `

        <div id="${gPath}" class="modal-section cust-group" data-min="${group.minPermitted || 0}" data-max="${group.maxPermitted || 0}" data-title="${escapeHTML(gTitle)}" style="background:#f9f9f9; padding:12px; border-radius:8px; border:1px solid #eee; margin-bottom:10px; transition: border 0.3s;">

            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">

                <h4 style="margin:0;">${escapeHTML(gTitle)}</h4>

                <span class="req-badge" style="font-size:12px; color:#666; background:#e0e0e0; padding:2px 6px; border-radius:4px; transition: all 0.3s;">${reqText}</span>

            </div>

        `;

        

        group.options.forEach((opt, oIdx) => {

            const isSoldOut = opt.isSoldOut === true;
            const oTitle = filterTrailingEnglish(parseText(opt.title));

            const oPrice = opt.price > 0 ? `+$${opt.price / 100}` : '';

            const oPath = `${gPath}_o${oIdx}`;

            

            let inputHtml = '';

            if (isRadio) {

                inputHtml = `<input type="radio" class="cust-input cust-radio" name="${gPath}" data-path="${oPath}" data-title="${escapeHTML(oTitle)}" data-price="${(opt.price || 0) / 100}" onchange="recalcCustomizations()" style="width:18px;height:18px;" ${isSoldOut ? 'disabled' : ''}>`;

            } else {

                const optMax = opt.maxPermitted || 0;

                inputHtml = `

                <div class="cust-stepper" style="display:flex; align-items:center; gap:8px; opacity: ${isSoldOut ? '0.5' : '1'};">

                    <button type="button" onclick="${isSoldOut ? '' : `changeCustQty(event, '${oPath}', -1, ${optMax})`}" style="width:28px;height:28px;border-radius:14px;border:1px solid #ccc;background:#fff;font-weight:bold;cursor:${isSoldOut ? 'not-allowed' : 'pointer'};color:#111;display:flex;align-items:center;justify-content:center;" ${isSoldOut ? 'disabled' : ''}>-</button>

                    <span id="qty_${oPath}" class="cust-qty cust-input" data-path="${oPath}" data-qty="0" data-title="${escapeHTML(oTitle)}" data-price="${(opt.price || 0) / 100}" style="font-size:15px;font-weight:bold;min-width:16px;text-align:center;">0</span>

                    <button type="button" onclick="${isSoldOut ? '' : `changeCustQty(event, '${oPath}', 1, ${optMax})`}" style="width:28px;height:28px;border-radius:14px;border:1px solid #ccc;background:#fff;font-weight:bold;cursor:${isSoldOut ? 'not-allowed' : 'pointer'};color:#111;display:flex;align-items:center;justify-content:center;" ${isSoldOut ? 'disabled' : ''}>+</button>

                </div>

                `;

            }

            

            const hasChildren = opt.childCustomizationList && opt.childCustomizationList.length > 0;

            const soldOutBadge = isSoldOut ? `<span style="font-size:12px; color:#fff; background:#ff4444; padding:2px 6px; border-radius:4px; margin-left:8px;">已售完</span>` : '';
            

            html += `

            <div class="cust-option-row" style="${isSoldOut ? 'opacity: 0.6; pointer-events: none;' : ''}">

                <label style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eaeaea; cursor:${isSoldOut ? 'not-allowed' : 'pointer'};" onclick="${!isRadio ? 'event.preventDefault();' : ''}">

                        ${inputHtml}

                    ${renderGroups(opt.childCustomizationList, oPath)}

            html += `</div>`;

        });

        

        html += `</div>`;

    });

    return html;

}



function changeCustQty(event, oPath, delta, optMax) {

    if (event) {

        event.stopPropagation();

        event.preventDefault();

    }

    const qtySpan = document.getElementById(`qty_${oPath}`);

    if (!qtySpan) return;

    

    let current = parseInt(qtySpan.getAttribute('data-qty') || '0', 10);

    

    if (delta > 0) {

        if (optMax > 0 && current >= optMax) return;

        

        const groupDiv = qtySpan.closest('.cust-group');

        const groupMax = parseInt(groupDiv.getAttribute('data-max') || '0', 10);

        

        if (groupMax > 0) {

            let sum = 0;

            groupDiv.querySelectorAll(':scope > .cust-option-row > label > div > .cust-stepper > .cust-qty').forEach(span => {

                sum += parseInt(span.getAttribute('data-qty') || '0', 10);

            });

            if (sum >= groupMax) return;

        }

    }

    

    let newVal = current + delta;

    if (newVal < 0) newVal = 0;

    

    qtySpan.setAttribute('data-qty', newVal);

    qtySpan.innerText = newVal;

    

    recalcCustomizations();

}



function recalcCustomizations() {

    let extraPrice = 0;

    currentItem.selectedOptions = [];

    

    document.querySelectorAll('.cust-option-row').forEach(row => {

        const radio = row.querySelector(':scope > label .cust-radio');

        const qtySpan = row.querySelector(':scope > label .cust-stepper .cust-qty');

        const childrenDiv = row.querySelector(`:scope > div[id^="children_"]`);

        

        let isSelected = false;

        if (radio && radio.checked) isSelected = true;

        if (qtySpan && parseInt(qtySpan.getAttribute('data-qty') || '0', 10) > 0) isSelected = true;

        

        if (childrenDiv) {

            childrenDiv.style.display = isSelected ? 'block' : 'none';

        }

    });



    const getVisibleSelections = (container) => {

        container.querySelectorAll(':scope > .cust-group > .cust-option-row').forEach(row => {

            const radio = row.querySelector(':scope > label .cust-radio');

            const qtySpan = row.querySelector(':scope > label .cust-stepper .cust-qty');

            

            let qty = 0;

            if (radio && radio.checked) qty = 1;

            if (qtySpan) qty = parseInt(qtySpan.getAttribute('data-qty') || '0', 10);

            

            if (qty > 0) {

                const price = parseFloat(radio ? radio.getAttribute('data-price') : qtySpan.getAttribute('data-price')) || 0;

                const title = radio ? radio.getAttribute('data-title') : qtySpan.getAttribute('data-title');

                

                extraPrice += (price * qty);

if (qty > 1) {

currentItem.selectedOptions.push(`${title} x${qty}`);

} else {

currentItem.selectedOptions.push(title);

}

                

                const childrenDiv = row.querySelector(':scope > div[id^="children_"]');

                if (childrenDiv && childrenDiv.style.display !== 'none') {

                    getVisibleSelections(childrenDiv);

                }

            }

        });

    };

    

    const rootArea = document.getElementById('customizationsArea');

    if (rootArea) getVisibleSelections(rootArea);

    

    currentItem.totalPrice = currentItem.basePrice + extraPrice;

    updateModalPrice();

}

                          uberPayload.time = {
                              scheduled: true,
                              date: sData.date,
                              startTime: sData.startTime,
                              startTimeMs: startTimeMs,
                              endTime: sData.endTime,
                              deliveryType: 'ASAP'
                          };
                      } catch (e) {}
                  }
              }

              console.log('📡 [開啟店家] 直送 Uber Payload:', JSON.stringify(uberPayload, null, 2));
              
              const uberHeaders = {
                  "accept": "*/*",
                  "accept-language": "zh-TW,zh;q=0.9,en-US;q=0.8,en;q=0.7",
                  "content-type": "application/json",

                  "x-uber-target-location-latitude": currentLat.toString(),

              };

              const res = await fetch(`${API_BASE_URL}/api/store_v3`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(uberPayload)
              });

              
              const textRes = await res.text();
              try {

                  if (!json.data) {
                      throw new Error("Uber 回傳了格式正確的 JSON，但裡面沒有 data 欄位！內容：" + textRes);
                  }
                  break; // 成功解析 JSON，跳出重試迴圈
              } catch (parseError) {


                  console.error(`Attempt ${retries + 1} failed - Non-JSON response:`, textRes);

                  if (retries >= 2) throw new Error('伺服器回傳了非 JSON 格式的錯誤: ' + textRes.substring(0, 50) + '...');

              }

          } catch (networkError) {

              if (retries >= 2) throw networkError;

          }

          retries++;

          await new Promise(r => setTimeout(r, 1000)); // 等待 1 秒後重試

      }
      }

      

      if (json.status === 'failure') {

        resultsDiv.innerHTML = oldHtml;

        throw new Error(json.data ? json.data.message : '取得菜單失敗');

      const d = json.data;

            // 解析所有可用時段，供預約與即時單狀態判斷

                          availableWindows.push(item.timeWindowViewModel.timeWindow);

                      }

          });

      }



      // 判斷是否為「當下正在營業中」

  function quickSetSchedule(startTimeSeconds, storeUuid, encodedStoreName, actionUrl) {
    document.getElementById('errorModalOverlay').style.display='none';
    
    // Switch to SCHEDULE mode
    scheduleMode = 'SCHEDULE';
    const targetDate = new Date(startTimeSeconds * 1000);
    
    // Find the correct date in modalDateSelect
    const pad = n => String(Math.floor(Math.abs(n))).padStart(2, '0');
    const targetDateStr = targetDate.getFullYear() + '-' + pad(targetDate.getMonth()+1) + '-' + pad(targetDate.getDate());
    
    if (uberTimeData && uberTimeData.dates) {
        const dateIdx = uberTimeData.dates.indexOf(targetDateStr);
        if (dateIdx !== -1) {
            const modalDateSelect = document.getElementById('modalDateSelect');
            modalDateSelect.selectedIndex = dateIdx;
            renderModalTimes();
        }
    }
    
    // Now find the matching time slot in modalTimeSelect
    const modalTimeSelect = document.getElementById('modalTimeSelect');
    const scheduleSelect = document.getElementById('scheduleTime');
    let found = false;
    
    for (let i = 0; i < modalTimeSelect.options.length; i++) {
        let optTime = 0;
        try {
            const parsed = JSON.parse(modalTimeSelect.options[i].value);
            const baseDate = new Date(parsed.date + "T00:00:00+08:00");
            optTime = baseDate.getTime() + (parsed.startTime * 60 * 1000);
        } catch(e) {
            optTime = new Date(modalTimeSelect.options[i].value).getTime();
        }

function escapeHTML(str) {

    return String(str).replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

function normalizeAddress(addr) {
  if (!addr) return addr;
  return addr.replace(/([零一二三四五六七八九十百]+)(號|樓)/g, function(match, numStr, suffix) {
    let map = {'零':0, '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9};
    if (!/十|百/.test(numStr) && numStr.length > 1) {
      return numStr.split('').map(c => map[c]).join('') + suffix;
    }
    let num = 0, temp = 0, unit = {'十':10, '百':100};
    if (numStr === '十') return '10' + suffix;
    let current = 0;
    for (let i = 0; i < numStr.length; i++) {
      let char = numStr[i];
      if (map[char] !== undefined) {
        current = map[char];
        if (i === numStr.length - 1) temp += current;
      } else if (unit[char] !== undefined) {
        if (current === 0 && char === '十') current = 1; 
        temp += current * unit[char];
        current = 0;
        if (char === '百') { num += temp; temp = 0; }
      }
    }
    num += temp;
    if (num > 0) return num + suffix;
    return match;
  });
}

function calcOrderCostB(items) {
    let totalSum = 0;
    items.forEach(it => totalSum += it.price * it.qty);

    let promoDiscount = totalSum >= 200 ? 200 : 0;
let totalExcessDeliveryFee = 0;
    const sg = {};
    items.forEach(it => { if(!sg[it.storeName||'']) sg[it.storeName||'']=[]; sg[it.storeName||''].push(it); });
    Object.keys(sg).forEach(s => totalExcessDeliveryFee += Math.max(0, ...sg[s].map(it => it.storeDeliveryFee||0)));

    let noBinCost = (totalSum - promoDiscount) + 130 + 30 + totalExcessDeliveryFee;

    let expanded = [];
    items.forEach(it => {
        for (let j = 0; j < it.qty; j++) {
            expanded.push({ name: it.title, price: it.price, storeName: it.storeName || '未知餐廳', note: it.note || '', storeDeliveryFee: it.storeDeliveryFee || 0, storeUrl: it.storeUrl });
        }
    });

    if (expanded.length <= 1) return { shouldSplit: false, noBinCost, bestCost: noBinCost, bins: null, savings: 0 };

    let bestBins = null;
    let bestCost = Infinity;

    for (let attempt = 0; attempt < 1000; attempt++) {
        let bins = [];
        let cur = [...expanded];
        
        for (let i = cur.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cur[i], cur[j]] = [cur[j], cur[i]];
        }

        let currentBin = { items: [], sum: 0 };
        for (let item of cur) {
            currentBin.items.push(item);
            currentBin.sum += item.price;
            if (currentBin.sum >= 200) {
                bins.push(currentBin);
                currentBin = { items: [], sum: 0 };
            }
        }
        if (currentBin.items.length > 0) {
            if (bins.length > 0) {
                bins[0].items.push(...currentBin.items);
                bins[0].sum += currentBin.sum;
            } else {
                bins.push(currentBin);
            }
        }

        if (bins.length > 1) {
            let cost = 0;
            let feePerBin = 130;
            for (let bin of bins) {
                let binPromo = bin.sum >= 200 ? 200 : 0;
                let binFoodCost = bin.sum - binPromo;
                let binExcess = 0;
                const bsg = {};
                bin.items.forEach(i => {
                    if(!bsg[i.storeName||'']) bsg[i.storeName||'']=[];
                    bsg[i.storeName||''].push(i);
                });
                Object.keys(bsg).forEach(s => binExcess += Math.max(0, ...bsg[s].map(it => it.storeDeliveryFee||0)));
                cost += binFoodCost + feePerBin + 30 + binExcess;
            }
            if (cost < bestCost) {
                bestCost = cost;
                bestBins = bins;
            }
        }
    }

    return {
        shouldSplit: totalSum >= 400 && bestBins && bestBins.length > 1 && bestCost < noBinCost,
        noBinCost,
        bestCost,
        bins: bestBins,
        savings: noBinCost - bestCost
    };
}
  function calcOrderCost(items) {

  let totalSum = 0;

  items.forEach(it => totalSum += it.price * it.qty);

  

  let promoDiscount = totalSum >= 285 ? 143 : Math.floor(totalSum / 2);

  let preOrderDiscount = 0;

  if (typeof scheduleMode !== 'undefined' && scheduleMode !== 'ASAP') {

    const ts = document.getElementById('scheduleTime');

    if (ts && ts.value) {

      if (getSelectedScheduleTimestamp() - new Date().getTime() >= 2.5 * 3600000) {

            preOrderDiscount = window.isGroceryStore ? 20 : 10;

      }

    }

  }

  

  let totalExcessDeliveryFee = 0;

  const sg = {};

  items.forEach(it => { if(!sg[it.storeName||'']) sg[it.storeName||'']=[]; sg[it.storeName||''].push(it); });

  Object.keys(sg).forEach(s => totalExcessDeliveryFee += Math.max(0, ...sg[s].map(it => it.storeDeliveryFee||0)));

  let noBinCost = (totalSum - promoDiscount) + 50 + totalExcessDeliveryFee - preOrderDiscount;



  let expanded = [];

  items.forEach(it => {

    for (let j = 0; j < it.qty; j++) {

      expanded.push({ name: it.title, price: it.price, storeName: it.storeName || '未命名餐廳', note: it.note || '', storeDeliveryFee: it.storeDeliveryFee || 0, storeUrl: it.storeUrl });

    }

  });



  if (expanded.length <= 1) return { shouldSplit: false, noBinCost, bestCost: noBinCost, bins: null, savings: 0 };



  expanded.sort((a, b) => b.price - a.price);



  let bestBins = null;

  let bestCost = Infinity;



  for (let attempt = 0; attempt < 1000; attempt++) {

    let bins = [];

    let cur = [...expanded];

    if (attempt > 0) {

      for (let i = cur.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [cur[i], cur[j]] = [cur[j], cur[i]];

      }

    }



    for (let item of cur) {

      let placed = false;

      for (let bin of bins) {

        if (bin.sum + item.price <= 285) {

          bin.items.push(item);

          bin.sum += item.price;

          placed = true;

          break;

        }

      }

      if (!placed) {

        let maxGap = -1;

        let bestBin = null;

        for (let bin of bins) {

          if (bin.sum < 285 && (285 - bin.sum) > maxGap) {

            maxGap = 285 - bin.sum;

            bestBin = bin;

          }

        }

        if (bestBin && (bestBin.sum + item.price <= 285 || Math.random() < 0.3)) {

          bestBin.items.push(item);

          bestBin.sum += item.price;

        } else {

          bins.push({ items: [item], sum: item.price });

        }

      }

    }



    let validSplit = true;

    for (let bin of bins) {

      if (bin.sum < 170) {

        validSplit = false;

        break;

      }

    }



    if (validSplit) {

      let cost = 0;

      let isASAP = (typeof scheduleMode === 'undefined' || scheduleMode === 'ASAP');
        let feePerBin = 50;

      for (let bin of bins) {

        let binPromo = bin.sum >= 285 ? 143 : Math.floor(bin.sum / 2);

        let binFoodCost = bin.sum - binPromo;

        

        let binExcess = 0;

        const bsg = {};

        bin.items.forEach(i => {

            if(!bsg[i.storeName||'']) bsg[i.storeName||'']=[];

            bsg[i.storeName||''].push(i);

        });

        Object.keys(bsg).forEach(s => binExcess += Math.max(0, ...bsg[s].map(it => it.storeDeliveryFee||0)));

        

        cost += binFoodCost + feePerBin + 30 + binExcess;

      }




      if (cost < bestCost) {

        bestCost = cost;

        bestBins = bins;

      }

    }

  }



  return {

    shouldSplit: totalSum >= 350 && bestBins && bestBins.length > 1 && bestCost < noBinCost,

    noBinCost,

    bestCost,

    bins: bestBins,

    savings: noBinCost - bestCost

  };

}

window.renderSplitTab = function(plan) {

    let origHtml = plan === 'A' ? window._splitOrigHtmlA : window._splitOrigHtmlB;
    let savings = plan === 'A' ? window._splitSavingsA : window._splitSavingsB;
    let bestCost = plan === 'A' ? window._splitBestCostA : window._splitBestCostB;
    let color = plan === 'A' ? '#06c167' : '#276ef1';
    
    if (!bins) return;
    for(let i = -1; i < bins.length; i++) {
        let dot = document.getElementById('split-dot-' + plan + '-' + i);
        if (dot) dot.style.background = (i === currentIndex) ? color : '#ccc';
    }

    const container = document.getElementById('splitTabContent' + plan);
    if (!container) return;

    if (currentIndex === -1) {
        container.innerHTML = origHtml;

    bin.items.forEach(item => { let key = item.name; counts[key] = (counts[key] || 0) + 1; });

        <div style="font-size:12px; color:#666; word-break:break-all; text-align:left; display:inline-block; max-height:80px; overflow-y:auto;">- ${itemStrs.join('<br>- ')}</div>
    `;
    container.innerHTML = html;
};

window.switchSplitTab = function(plan, dir) {
    let bins = plan === 'A' ? window._splitBinsA : window._splitBinsB;
    if (!bins) return;
    if (plan === 'A') {
        window._currentSplitIndexA += dir;
        if (window._currentSplitIndexA < -1) window._currentSplitIndexA = bins.length - 1;
        if (window._currentSplitIndexA >= bins.length) window._currentSplitIndexA = -1;
    } else {
        window._currentSplitIndexB += dir;
        if (window._currentSplitIndexB < -1) window._currentSplitIndexB = bins.length - 1;
        if (window._currentSplitIndexB >= bins.length) window._currentSplitIndexB = -1;
    }
    window.renderSplitTab(plan);
};

                      if (navRect.top < sbRect.top) sb.scrollTop -= sbRect.top - navRect.top;
