<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片文字辨識 (OCR) 工具</title>
    <!-- 引入 Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { margin-top: 0; color: #333; }
        .upload-area {
            border: 2px dashed #00B900;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            background: #f9f9f9;
        }
        .upload-area:hover { background: #e8f5e9; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin-bottom: 20px;
            border-radius: 8px;
            display: none;
        }
        #result {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fafafa;
        }
        .loading { display: none; color: #00B900; font-weight: bold; margin-bottom: 10px; }
        button {
            background: #00B900; color: white; border: none; padding: 10px 20px;
            border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📷 圖片文字辨識 (純前端處理)</h2>
        <p style="font-size: 14px; color: #666;">
            這是一個完全在手機/瀏覽器端運行的 OCR 工具。圖片不會上傳到任何伺服器，直接利用 Tesseract.js 解析！
        </p>
        
        <label class="upload-area">
            <div>點擊選擇圖片或拍照</div>
            <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImage(event)">
        </label>

        <img id="preview" alt="Image preview">
        
        <div class="loading" id="loading">⏳ 正在解析文字中，請稍候 (初次載入需下載語言包)... <span id="progress"></span></div>
        
        <h3>辨識結果：</h3>
        <textarea id="result" placeholder="解析後的文字會顯示在這裡..."></textarea>
    </div>

    <script>
        async function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 預覽圖片
            const img = document.getElementById('preview');
            img.src = URL.createObjectURL(file);
            img.style.display = 'block';

            // 顯示 Loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').value = '';

            try {
                // 使用 Tesseract.js 進行辨識 (支援繁體中文 + 英文)
                const worker = await Tesseract.createWorker('chi_tra+eng', 1, {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            document.getElementById('progress').innerText = Math.round(m.progress * 100) + '%';
                        }
                    }
                });
                
                const { data: { text } } = await worker.recognize(file);
                
                document.getElementById('result').value = text;
                await worker.terminate();
            } catch (error) {
                console.error(error);
                document.getElementById('result').value = '辨識失敗：' + error.message;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
