<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>方案 C (WebRTC 極速影音) - FindDog 直播實測</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #E0E0E0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .header {
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
            max-width: 1280px;
        }
        .header h1 {
            font-size: 22px;
            color: #FFFFFF;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        /* 方案切換導覽列 */
        .nav-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .nav-btn {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            color: #AAA;
            background: #252525;
            border: 1px solid #3A3A3A;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            background: #333333;
            color: #FFF;
            border-color: #555;
        }
        .nav-btn.active {
            background: #2E7D32;
            color: #FFFFFF;
            border-color: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.4);
        }
        /* 播放視窗容器 */
        .stage-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 16 / 9;
        }
        .stage-container img, .stage-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        /* 浮水印資訊列 */
        .overlay-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-family: monospace;
            color: #4CAF50;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            z-index: 10;
        }
        /* 控制列 */
        .controls-bar {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1280px;
        }
        .action-btn {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            color: #FFF;
            background: #1976D2;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .action-btn:hover { background: #1565C0; }
        .action-btn.secondary { background: #424242; }
        .action-btn.secondary:hover { background: #555555; }
        .action-btn.danger { background: #D32F2F; }
        .action-btn.danger:hover { background: #C62828; }

        /* 說明資訊卡 */
        .info-card {
            margin-top: 16px;
            padding: 14px 18px;
            background: #1E1E1E;
            border: 1px solid #2C2C2C;
            border-radius: 10px;
            width: 100%;
            max-width: 1280px;
            font-size: 14px;
            line-height: 1.6;
            color: #BBB;
        }
        .info-card b { color: #FFF; }
        .tag {
            display: inline-block;
            background: #333;
            color: #81C784;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
        }

        /* 全螢幕自適應 */
        :fullscreen .stage-container {
            max-width: 100vw;
            max-height: 100vh;
            border-radius: 0;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐾 FindDog 視訊直播畫質盲測系統</h1>
        <div class="nav-bar">
            <a href="/webA.htm" class="nav-btn">方案 A：1080p 超清原生直出</a>
            <a href="/webB.htm" class="nav-btn">方案 B：保邊降噪銳化 + 音訊</a>
            <a href="/webC.htm" class="nav-btn active">方案 C：WebRTC 極速影音</a>
        </div>
    </div>

    
    <div class="stage-container" id="videoStage">
        <span class="overlay-badge" id="infoBadge">方案 C: WebRTC P2P | 狀態: 準備連線...</span>
        <video id="remoteVideoC" autoplay playsinline controls onclick="toggleFullScreen('videoStage')"></video>
    </div>

    <div class="controls-bar">
        <button class="action-btn" id="connectBtn" onclick="startWebRTC()">⚡ 啟動 WebRTC 直播</button>
        <button class="action-btn secondary" onclick="toggleFullScreen('videoStage')">⛶ 切換全螢幕</button>
        <button class="action-btn danger" onclick="stopWebRTC()">⏹ 斷開連線</button>
    </div>

    <div class="info-card">
        <span class="tag">WebRTC 超低延遲</span>
        <b>核心技術特點：</b> 採用現代網頁標準 <b>WebRTC (H.264 / VP8)</b> 協定。視訊與 48kHz 音訊封包化傳輸，延遲極低 (約 0.1~0.3 秒)，頻寬較 MJPEG 節省高達 <b>85%~90%</b>。前端由瀏覽器直接使用顯卡硬體解碼，順暢不掉幀，兼顧高解析度與即時性。
    </div>
    

    <script>
        // 自動識別後端 API 伺服器主機 (支援 finddog.online 跨網域反代、本地 localhost 與 file: 協議)
        let BASE_HOST = '';
        if (location.protocol === 'file:') {
            BASE_HOST = 'http://127.0.0.1:8000';
        } else if (location.hostname.includes('finddog.online')) {
            BASE_HOST = 'https://api.9ysong.shop';
        }

        function toggleFullScreen(elemId) {
            const el = document.getElementById(elemId);
            if (!document.fullscreenElement) {
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
        
    let pc = null;
    const badge = document.getElementById('infoBadge');
    const video = document.getElementById('remoteVideoC');

    async function startWebRTC() {
        if (pc) {
            pc.close();
            pc = null;
        }
        badge.innerText = '方案 C: 正在建立 WebRTC 連線 (ICE 協商)...';
        badge.style.color = '#FFD54F';

        pc = new RTCPeerConnection({
            iceServers: [
                { urls: ['stun:stun.l.google.com:19302'] }
            ]
        });

        pc.addTransceiver('video', { direction: 'recvonly' });
        pc.addTransceiver('audio', { direction: 'recvonly' });

        pc.ontrack = function(event) {
            if (event.track.kind === 'video') {
                video.srcObject = event.streams[0];
                badge.innerText = '方案 C: WebRTC 視訊已連通 (低延遲 1080p)';
                badge.style.color = '#81C784';
            }
        };

        pc.onconnectionstatechange = function() {
            if (pc.connectionState === 'connected') {
                badge.innerText = '方案 C: WebRTC 串流連線成功 (即時影音)';
                badge.style.color = '#4CAF50';
            } else if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                badge.innerText = '方案 C: 連線已關閉或中斷';
                badge.style.color = '#E57373';
            }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await new Promise(resolve => {
            if (pc.iceGatheringState === 'complete') {
                resolve();
            } else {
                function checkState() {
                    if (pc.iceGatheringState === 'complete') {
                        pc.removeEventListener('icegatheringstatechange', checkState);
                        resolve();
                    }
                }
                pc.addEventListener('icegatheringstatechange', checkState);
                setTimeout(resolve, 1500);
            }
        });

        try {
            const resp = await fetch(BASE_HOST + '/api/stream/c/offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                mode: 'cors',
                body: JSON.stringify({
                    sdp: pc.localDescription.sdp,
                    type: pc.localDescription.type
                })
            });

            if (!resp.ok) {
                badge.innerText = 'WebRTC 信令交換失敗 HTTP ' + resp.status;
                badge.style.color = '#E57373';
                return;
            }

            const answer = await resp.json();
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
        } catch (err) {
            badge.innerText = 'WebRTC 請求異常: ' + err;
            badge.style.color = '#E57373';
        }
    }

    function stopWebRTC() {
        if (pc) {
            pc.close();
            pc = null;
        }
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(t => t.stop());
            video.srcObject = null;
        }
        badge.innerText = '方案 C: 已手動中斷連線';
        badge.style.color = '#BBB';
    }

    window.addEventListener('DOMContentLoaded', () => {
        startWebRTC();
    });
    
    </script>
</body>
</html>
