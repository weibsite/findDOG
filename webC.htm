<!DOCTYPE html>
<html>
<head>
    <title>遠端本機視訊 (方案C: WebRTC 超低延遲)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <style>
        body { text-align: center; background-color: #222; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #f0f0f0; margin-bottom: 20px; }
        #video-container { position: relative; display: inline-block; max-width: 100%; }
        video { border: 2px solid #444; border-radius: 8px; max-width: 100%; height: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.5); cursor: pointer; background-color: #000; }
        .btn { margin-top: 15px; padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { background-color: #45a049; }
        .btn-alt { background-color: #008CBA; }
        .btn-alt:hover { background-color: #007bb5; }
        #status-text { color: #ffeb3b; font-weight: bold; margin-bottom: 15px; display: block; }
        :fullscreen video { border: none; border-radius: 0; width: 100vw; height: 100vh; object-fit: contain; background: black; }
        :-webkit-full-screen video { border: none; border-radius: 0; width: 100vw; height: 100vh; object-fit: contain; background: black; }
        :-ms-fullscreen video { border: none; border-radius: 0; width: 100vw; height: 100vh; object-fit: contain; background: black; }
    </style>
</head>
<body>
    <h1>本機視訊直播 (WebRTC 終極順暢版)</h1>
    <span id="status-text">連線中... 正在取得動態網域</span>
    
    <div id="video-container">
        <!-- 注意：使用 video 標籤，需加上 autoplay, playsinline -->
        <video id="video-feed" autoplay playsinline title="點擊放大全螢幕" onclick="toggleFullScreen()"></video>
    </div>
    <br>
    <button class="btn" onclick="startWebRTC()" id="start-btn" style="display:none;">開始視訊連線</button>
    <button class="btn" onclick="toggleFullScreen()">切換全螢幕</button>
    <br><br>
    <a href="webA.htm" class="btn btn-alt">退回方案A (舊版影像)</a>
    <a href="webB.htm" class="btn btn-alt" style="background-color: #f44336;">退回方案B (舊版影像+聲音)</a>

    <script>
        let serverHttpUrl = "";
        let pc = null;

        async function fetchDynamicUrl() {
            try {
                const configRes = await fetch('config.json?t=' + Date.now());
                const configData = await configRes.json();
                if (configData && configData.ws_url) {
                    let ws_url = configData.ws_url;
                    serverHttpUrl = ws_url.replace('wss://', 'https://').replace('ws://', 'http://').replace(/\/ws$/, '');
                    
                    document.getElementById('status-text').innerText = "取得網址成功，點擊下方按鈕開始連線";
                    document.getElementById('status-text').style.color = "#4CAF50";
                    document.getElementById('start-btn').style.display = "inline-block";
                } else {
                    document.getElementById('status-text').innerText = "讀取 config.json 失敗，無 ws_url。";
                    document.getElementById('status-text').style.color = "red";
                }
            } catch (e) {
                document.getElementById('status-text').innerText = "連線錯誤：" + e;
                document.getElementById('status-text').style.color = "red";
            }
        }

        async function startWebRTC() {
            document.getElementById('status-text').innerText = "WebRTC 協商中，請稍候...";
            document.getElementById('start-btn').style.display = "none";
            
            const config = {
                sdpSemantics: 'unified-plan',
                iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }]
            };

            pc = new RTCPeerConnection(config);

            // 當伺服器傳送影音串流時觸發
            pc.addEventListener('track', function(evt) {
                if (evt.track.kind == 'video') {
                    document.getElementById('video-feed').srcObject = evt.streams[0];
                } else {
                    // 如果有聲音，加入同一個串流裡自動播放
                    document.getElementById('video-feed').srcObject = evt.streams[0];
                }
            });

            // 加入接收方向的要求 (我們要接收影片跟聲音)
            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'recvonly' });

            // 建立 Offer
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            // 傳送給後端
            try {
                const response = await fetch(serverHttpUrl + '/webrtc/offer', {
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type,
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    method: 'POST'
                });

                const answer = await response.json();
                await pc.setRemoteDescription(answer);
                document.getElementById('status-text').innerText = "WebRTC 連線成功！";
            } catch (e) {
                document.getElementById('status-text').innerText = "WebRTC 協商失敗：" + e;
                document.getElementById('status-text').style.color = "red";
                document.getElementById('start-btn').style.display = "inline-block";
            }
        }

        function toggleFullScreen() {
            const elem = document.getElementById("video-feed");
            if (!document.fullscreenElement && !document.mozFullScreenElement &&
                !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (elem.requestFullscreen) { elem.requestFullscreen(); }
                else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
                else if (elem.mozRequestFullScreen) { elem.mozRequestFullScreen(); }
                else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                else if (document.msExitFullscreen) { document.msExitFullscreen(); }
                else if (document.mozCancelFullScreen) { document.mozCancelFullScreen(); }
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            }
        }

        // 載入網頁時自動抓取網址
        window.onload = fetchDynamicUrl;
    </script>
</body>
</html>
