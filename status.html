<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收款資訊</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f5f7; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 15px 10px; box-sizing: border-box; }
        .container { background-color: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 100%; box-sizing: border-box; }
        h2 { color: #333; margin-top: 0; font-size: 16px; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .payment-box { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .title { font-size: 14px; color: #333; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; }
        .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .info-label { font-size: 13px; color: #666; }
        .info-value { font-size: 16px; color: #000; font-weight: bold; }
        .action-btn { background-color: #df2c2d; color: white; border: none; padding: 6px 12px; font-size: 13px; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .copy-btn { background-color: #666; color: white; border: none; padding: 4px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>💰 收款資訊</h2>
        
        <div class="payment-box">
            <div class="title">🔴 街口支付</div>
            <div class="info-row">
                <span class="info-label">街口帳號：</span>
                <div style="display: flex; align-items: center;">
                    <span class="info-value">900791475</span>
                    <button class="copy-btn" onclick="copyText('900791475')">複製</button>
                </div>
            </div>
            <div style="margin-top: 10px; text-align: right;">
                <a href="https://service.jkopay.com/r/transfer?j=Transfer:900791475" class="action-btn" target="_blank">開啟 APP</a>
            </div>
        </div>

        <div class="payment-box" style="margin-bottom: 0;">
            <div class="title">🏦 銀行匯款 (街口銀行)</div>
            <div class="info-row">
                <span class="info-label">銀行代碼：</span>
                <span class="info-value">396</span>
            </div>
            <div class="info-row">
                <span class="info-label">匯款帳號：</span>
                <div style="display: flex; align-items: center;">
                    <span class="info-value">900791475</span>
                    <button class="copy-btn" onclick="copyText('900791475')">複製</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // LIFF 初始化確保瀏覽器功能正常
        liff.init({ liffId: "YOUR_NEW_LIFF_ID" }).catch(err => console.error(err));

        function copyText(text) {
            const tempInput = document.createElement("input");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("已複製帳號：" + text);
        }
    </script>
</body>
</html>
