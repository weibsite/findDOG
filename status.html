<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>店家目前營業狀態</title>
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
        }
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background-color: #f4f5f7; 
            display: flex; 
            flex-direction: column; 
        }
        
        .status-section { 
            flex: 1; 
            padding: 20px; 
            box-sizing: border-box; 
            background: linear-gradient(135deg, #00B900 0%, #008a00 100%); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        .status-title { font-size: 18px; opacity: 0.9; margin-bottom: 15px; }
        .status-badge { 
            background: white; 
            color: #00B900; 
            padding: 15px 30px; 
            border-radius: 40px; 
            font-size: 28px; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .status-section.closed { background: linear-gradient(135deg, #ff3366 0%, #d81b43 100%); }
        .status-section.closed .status-badge { color: #d81b43; }
        
        .status-section.preorder { background: linear-gradient(135deg, #f39c12 0%, #d68910 100%); }
        .status-section.preorder .status-badge { color: #d68910; }
        
        .status-section.busy { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); }
        .status-section.busy .status-badge { color: #2980b9; font-size: 20px; padding: 15px 25px; }
        
        .notice-text {
            font-size: 16px; 
            margin-top: 15px; 
            text-align: center; 
            font-weight: bold; 
            line-height: 1.4; 
            color: #fff200; 
            text-shadow: 0px 1px 2px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="status-container" class="status-section">
        <div class="status-title">店家目前營業狀態</div>
        <div id="status-text" class="status-badge">讀取中...</div>
        <div class="notice-text">
            預約單直送約等待20分鐘<br>
            請善用預約單餐期不用等待
        </div>
    </div>

    <script>
        function setStatus(type, text) {
            const container = document.getElementById('status-container');
            const badge = document.getElementById('status-text');
            
            container.className = 'status-section';
            if(type === 'closed') container.classList.add('closed');
            if(type === 'preorder') container.classList.add('preorder');
            if(type === 'busy') container.classList.add('busy');
            
            badge.innerText = text;
            
            if (text.length > 10) {
                badge.style.fontSize = "20px";
                badge.style.padding = "15px 25px";
            } else {
                badge.style.fontSize = "";
                badge.style.padding = "";
            }
        }

        async function loadStatus() {
            try {
                const configRes = await fetch('/config.json?t=' + new Date().getTime());
                const configData = await configRes.json();
                const lineUrl = configData.line_url;
                if (!lineUrl) return;

                const response = await fetch(lineUrl + '/api/status');
                const data = await response.json();
                setStatus(data.type, data.text);
            } catch (err) {
                console.error("狀態讀取失敗", err);
                setStatus("open", "營業中"); 
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStatus();
            setInterval(loadStatus, 5000);
        });
    </script>
</body>
</html>
