<!DOCTYPE html>
<html>
<head>
    <title>歷史影像回放 (DVR)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <style>
        body { text-align: center; background-color: #1a1a1a; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #f0f0f0; margin-bottom: 20px; }
        #player-container { margin: 0 auto; max-width: 800px; }
        video { width: 100%; border: 2px solid #444; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); background-color: #000; }
        .btn { margin-top: 15px; padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { background-color: #45a049; }
        .btn-alt { background-color: #008CBA; }
        #list-container { margin-top: 20px; max-width: 800px; margin-left: auto; margin-right: auto; text-align: left; background: #2a2a2a; padding: 15px; border-radius: 8px; max-height: 300px; overflow-y: auto; }
        .record-item { padding: 10px; border-bottom: 1px solid #444; cursor: pointer; display: flex; justify-content: space-between; }
        .record-item:hover { background-color: #3a3a3a; }
        .record-title { font-weight: bold; color: #4CAF50; }
        .record-size { color: #aaa; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>歷史影像回放</h1>
    <div id="player-container">
        <video id="video-player" controls autoplay playsinline></video>
    </div>
    
    <div id="list-container">
        <h3 style="margin-top:0;">可用錄影檔 (自動載入中...)</h3>
        <div id="recordings-list"></div>
    </div>
    
    <br>
    <a href="webC.htm" class="btn btn-alt">返回即時視訊 (方案C)</a>

    <script>
        let serverHttpUrl = "";

        async function fetchRecordings() {
            try {
                // 先取得動態網域
                const configRes = await fetch('config.json?t=' + Date.now());
                const configData = await configRes.json();
                if (configData && configData.ws_url) {
                    let ws_url = configData.ws_url;
                    serverHttpUrl = ws_url.replace('wss://', 'https://').replace('ws://', 'http://').replace(/\/ws$/, '');
                    
                    // 向後端請求錄影清單
                    const recRes = await fetch(serverHttpUrl + '/api/recordings');
                    const recData = await recRes.json();
                    
                    renderList(recData.recordings);
                }
            } catch (e) {
                document.getElementById('recordings-list').innerHTML = "<p style='color:red;'>無法載入錄影清單：" + e + "</p>";
            }
        }

        function renderList(recordings) {
            const listDiv = document.getElementById('recordings-list');
            listDiv.innerHTML = "";
            
            if (recordings.length === 0) {
                listDiv.innerHTML = "<p>目前還沒有任何錄影資料。</p>";
                return;
            }

            recordings.forEach((rec, index) => {
                const item = document.createElement('div');
                item.className = 'record-item';
                item.innerHTML = `
                    <span class="record-title">${rec.filename}</span>
                    <span class="record-size">${rec.time} | ${rec.size_mb} MB</span>
                `;
                item.onclick = () => playVideo(rec.filename);
                listDiv.appendChild(item);
                
                // 自動播放最新的第一個影片
                if (index === 0) {
                    playVideo(rec.filename);
                }
            });
        }

        function playVideo(filename) {
            const player = document.getElementById('video-player');
            player.src = serverHttpUrl + '/recordings/' + filename;
            player.play();
        }

        window.onload = fetchRecordings;
    </script>
</body>
</html>
